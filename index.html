ground:#eef2f4;border-radius:10px;width:40px;height:40px;font-size:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.nav{position:fixed;left:0;right:0;bottom:0;height:78px;background:var(--nav);display:flex;justify-content:center;gap:4px;z-index:30;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#c4cdd1;border-radius:13px;min-width:92px;max-width:150px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button.active{background:var(--orange);color:#fff}.nav svg{width:24px;height:24px}.nav span{font-size:11px}.notice{padding:12px 14px;border-radius:12px;background:#fff1e8;border:1px solid #ffd0b5;margin:10px 0}.report{background:#fff;padding:28px;border-radius:16px;border:1px solid var(--line)}.report h1{margin:0 0 5px}.report .reportmeta{color:var(--muted);margin-bottom:20px}.report section{margin:20px 0}.report table{width:100%;border-collapse:collapse}.report th,.report td{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:12px}.report th{background:#edf1f2}.print-only{display:none}

<div class="app">
<header class="top">
  <div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M7 4h10v16H7z"/><path d="M9 10h6M9 13h6M9 16h4"/></svg></div><span>Tesorería</span></div>

<script>"use strict";
const DB="TesoreriaMultiorganizacional_v4", VER=4;
const STORES=["organizations","people","movements","settings","audit"];
const S={db:null,orgId:localStorage.getItem("tm_org_v4")||"",view:localStorage.getItem("tm_view_v4")||"inicio",ready:false,currentReport:null};
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(Number(n)||0);
const dateOnly=x=>{const s=String(x??""); return s.includes("T")?s.slice(0,10):s.slice(0,10)};
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toUpperCase();
const sortName=(a,b)=>norm(a.name).localeCompare(norm(b.name),"es");
const monthsLocal=["Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function toast(t){const e=document.createElement("div");e.textContent=t;e.style.cssText="position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#26343a;color:#fff;padding:12px 16px;border-radius:12px;z-index:100;font-weight:650;max-width:90%;text-align:center";document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const db=r.result;STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:"id"})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function all(store){return new Promise((res,rej)=>{const r=S.db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function get(store,id){return new Promise((res,rej)=>{const r=S.db.transaction(store,"readonly").objectStore(store).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{const tx=S.db.transaction(store,"readwrite");tx.objectStore(store).put(obj);tx.oncomplete=()=>res(obj);tx.onerror=()=>rej(tx.error)})}
function del(store,id){return new Promise((res,rej)=>{const tx=S.db.transaction(store,"readwrite");tx.objectStore(store).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function audit(action,detail){await put("audit",{id:uid(),action,detail,at:new Date().toISOString()})}
async function orgs(){return (await all("organizations")).sort(sortName)}
async function currentOrg(){return S.orgId?get("organizations",S.orgId):null}
async function scopedPeople(){return (await all("people")).filter(p=>(p.orgIds||[]).includes(S.orgId)).sort(sortName)}
async function scopedMoves(){return (await all("movements")).filter(m=>m.orgId===S.orgId).sort((a,b)=>dateOnly(b.date).localeCompare(dateOnly(a.date)))}
function icon(name){const m={home:"<path d='M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'/>",people:"<circle cx='9' cy='8' r='3'/><path d='M2 20c0-4 3-6 7-6s7 2 7 6'/><circle cx='17' cy='9' r='2'/><path d='M16 14c3 .3 5 2.3 5 6'/>",moves:"<path d='M4 7h16M4 12h11M4 17h16'/><path d='M16 9l4 3-4 3'/>",fees:"<rect x='4' y='3' width='16' height='18' rx='2'/><path d='M8 8h8M8 12h8M8 16h5'/>",reports:"<path d='M4 19V9M10 19V5M16 19v-8M3 19h17'/>",more:"<circle cx='5' cy='12' r='1.5'/><circle cx='12' cy='12' r='1.5'/><circle cx='19' cy='12' r='1.5'/>",edit:"<path d='M4 20h4L19 9a2 2 0 0 0-4-4L4 16v4z'/>",eye:"<path d='M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z'/><circle cx='12' cy='12' r='2.5'/>",trash:"<path d='M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v6M14 11v6'/>",download:"<path d='M12 3v12M7 10l5 5 5-5M4 21h16'/>",share:"<path d='M12 16V4M7 9l5-5 5 5M5 14v6h14v-6'/>",close:"<path d='M6 6l12 12M18 6L6 18'/>",check:"<path d='M5 12l4 4L19 6'/>",search:"<circle cx='11' cy='11' r='7'/><path d='m20 20-4-4'/>",back:"<path d='M15 18l-6-6 6-6'/>",settings:"<path d='M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z'/><path d='M19.4 15a1.8 1.8 0 0 0 .3 2l.1.1-1.8 1.8-.1-.1a1.8 1.8 0 0 0-2-.3 1.8 1.8 0 0 0-1.1 1.6v.2h-2.6v-.2a1.8 1.8 0 0 0-1.1-1.6 1.8 1.8 0 0 0-2 .3l-.1.1-1.8-1.8.1-.1a1.8 1.8 0 0 0 .3-2 1.8 1.8 0 0 0-1.6-1.1h-.2v-2.6h.2A1.8 1.8 0 0 0 7.5 9.7a1.8 1.8 0 0 0-.3-2l-.1-.1 1.8-1.8.1.1a1.8 1.8 0 0 0 2 .3A1.8 1.8 0 0 0 12.1 4v-.2h2.6V4a1.8 1.8 0 0 0 1.1 1.6 1.8 1.8 0 0 0 2-.3l.1-.1 1.8 1.8-.1.1a1.8 1.8 0 0 0-.3 2 1.8 1.8 0 0 0 1.6 1.1h.2v2.6h-.2a1.8 1.8 0 0 0-1.5 1.2z'/>"};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${m[name]||m.more}</svg>`}
const navItems=[["inicio","Inicio","home"],["personas","Personas","people"],["movimientos","Movimientos","moves"],["cuotas","Cuotas","fees"],["informes","Informes","reports"],["mas","Más","more"]];
function renderNav(){$("nav").innerHTML=navItems.map(([v,t,i])=>`<button data-view="${v}" class="${S.view===v?"active":""}">${icon(i)}<span>${t}</span></button>`).join("");document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{S.view=b.dataset.view;localStorage.setItem("tm_view_v4",S.view);render()})}
async function refreshOrgs(){const os=await orgs(),sel=$("orgSelect");sel.innerHTML=os.length?os.map(o=>`<option value="${esc(o.id)}">${esc(o.name)}</option>`).join(""):`<option value="">Sin organizaciones</option>`;if(!os.some(o=>o.id===S.orgId))S.orgId=os[0]?.id||"";sel.value=S.orgId;localStorage.setItem("tm_org_v4",S.orgId)}
$("orgSelect").onchange=async e=>{S.orgId=e.target.value;localStorage.setItem("tm_org_v4",S.orgId);S.view="inicio";render()};
$("refreshBtn").onclick=()=>render();
$("modalClose").onclick=closeModal;$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function closeModal(){$("modal").classList.remove("open");$("modalBody").innerHTML=""}
function showModal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.add("open")}
function field(label,id,type="text",value="",extra=""){return `<div class="field"><label>${esc(label)}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function selectField(label,id,value,options){return `<div class="field"><label>${esc(label)}</label><select id="${id}">${options.map(v=>`<option value="${esc(v)}" ${norm(v)===norm(value)?"selected":""}>${esc(v||"—")}</option>`).join("")}</select></div>`}
const MOVEMENT_TYPES=["Ingreso","Egreso","Aporte"];
const FONDOS=["Tesorería","Presidenta"];
const MEDIOS=["Efectivo","Transferencia","Depósito","Tarjeta","Cheque","Otro digital"];
async function moveForm(kind="Ingreso",record=null){const people=await scopedPeople();const isAporte=kind==="Aporte";const html=`<div class="formgrid">${field("Fecha","fdate","date",dateOnly(record?.date)||new Date().toISOString().slice(0,10),"required")}${field("Monto","famount","number",record?.amount||"","min='1' step='1' required")}${field("Concepto / categoría","fconcept","text",record?.concept||"","required")}${isAporte?selectField("Tipo de aporte","ftipoaporte",record?.tipoAporte||"Anual",["Anual","Extraordinaria"]):""}${selectField("Fondo / caja","ffondo",record?.fondo||"Tesorería",FONDOS)}${selectField("Medio","fmedio",record?.medio||"Efectivo",MEDIOS)}<div class="field full"><label>Integrante / beneficiario</label><select id="fperson"><option value="">— Ninguno —</option>${people.map(p=>`<option value="${esc(p.id)}" ${record?.personId===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div>${field("Responsable","fresp", "text",record?.responsable||"")}${field("Autoriza","faut","text",record?.autoriza||"")}${field("Responsable del gasto","fgasto","text",record?.responsableGasto||"")}${field("Comprobante","fcomp","text",record?.comprobante||"")}${field("Respaldo","fback","text",record?.respaldo||"")}${field("Banco","fbank","text",record?.banco||"")}${field("Tipo de cuenta","ftipocta","text",record?.tipoCuenta||"")}${field("N° cuenta","fnumcta","text",record?.numCuenta||"")}${field("Titular cuenta","ftitular","text",record?.titularCuenta||"")}${field("Estado","festado","text",record?.estado||"Registrado")}${field("Observaciones","fobs","text",record?.observaciones||"")}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="saveMove">Guardar</button></div>`;showModal((record?"Editar ":"Nuevo ")+kind,html);$("saveMove").onclick=async()=>{const person=$("fperson").value;const p=person?await get("people",person):null;const obj={...(record||{}),id:record?.id||uid(),orgId:S.orgId,date:$("fdate").value,amount:Number($("famount").value)||0,concept:$("fconcept").value.trim(),kind,fondo:$("ffondo").value,medio:$("fmedio").value,personId:person,personName:p?.name||"",rut:p?.rut||record?.rut||"",tutor:p?.tutor||record?.tutor||"",responsable:$("fresp").value.trim(),actor:$("fresp").value.trim(),autoriza:$("faut").value.trim(),responsableGasto:$("fgasto").value.trim(),comprobante:$("fcomp").value.trim(),respaldo:$("fback").value.trim(),banco:$("fbank").value.trim(),tipoCuenta:$("ftipocta").value.trim(),numCuenta:$("fnumcta").value.trim(),titularCuenta:$("ftitular").value.trim(),estado:$("festado").value.trim()||"Registrado",observaciones:$("fobs").value.trim(),tipoAporte:isAporte?$("ftipoaporte").value:""};if(!obj.concept||obj.amount<=0){toast("Completa concepto y monto");return}await put("movements",obj);await audit(record?"editar":"crear",kind+": "+obj.concept);closeModal();render();toast("Movimiento guardado correctamente")}}

async function personForm(record=null){const html=`<div class="formgrid">${field("Nombre completo","pname","text",record?.name||"","required")}${field("RUT","prut","text",record?.rut||"")}${field("Tutor / responsable","ptutor","text",record?.tutor||"")}${field("Teléfono","pphone","text",record?.phone||"")}${field("Correo","pemail","email",record?.email||"")}${field("Banco","pbank","text",record?.bank||"")}${field("Tipo de cuenta","ptype","text",record?.accountType||"")}${field("N° cuenta","pnum","text",record?.accountNumber||"")}${field("Titular cuenta","pholder","text",record?.accountHolder||"")}${field("RUT titular","pholderrut","text",record?.holderRut||"")}${field("Correo transferencia","ptransfer","email",record?.transferEmail||"")}${field("Roles","proles","text",record?.roles||"Integrante")}${field("Observaciones","pobs","text",record?.observations||"")}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="savePerson">Guardar</button></div>`;showModal(record?"Editar integrante":"Nuevo integrante",html);$("savePerson").onclick=async()=>{const name=$("pname").value.trim();if(!name){toast("Ingresa el nombre");return}const obj={...(record||{}),id:record?.id||uid(),name,rut:$("prut").value.trim(),tutor:$("ptutor").value.trim(),phone:$("pphone").value.trim(),email:$("pemail").value.trim(),bank:$("pbank").value.trim(),accountType:$("ptype").value.trim(),accountNumber:$("pnum").value.trim(),accountHolder:$("pholder").value.trim(),holderRut:$("pholderrut").value.trim(),transferEmail:$("ptransfer").value.trim(),roles:$("proles").value.trim(),observations:$("pobs").value.trim(),orgIds:Array.from(new Set([...(record?.orgIds||[]),S.orgId]))};await put("people",obj);await audit(record?"editar":"crear","Integrante: "+name);closeModal();render();toast("Integrante guardado correctamente")}}

function validReceived(m){return ["Aporte","Ingreso"].includes(m.kind)&&!norm(m.estado).includes("ANUL")&&!norm(m.estado).includes("PENDIENTE")}
function validPaid(m){return m.kind==="Egreso"&&!norm(m.estado).includes("ANUL")&&!norm(m.estado).includes("PENDIENTE")}
function financial(ms){const received=ms.filter(validReceived),paid=ms.filter(validPaid);const byFund=f=>({in:received.filter(m=>norm(m.fondo)===norm(f)).reduce((a,m)=>a+m.amount,0),out:paid.filter(m=>norm(m.fondo)===norm(f)).reduce((a,m)=>a+m.amount,0)});const t=byFund("Tesorería"),p=byFund("Presidenta");const annual=received.filter(m=>m.kind==="Aporte"&&norm(m.tipoAporte)==="ANUAL").reduce((a,m)=>a+m.amount,0);const extra=received.filter(m=>m.kind==="Aporte"&&norm(m.tipoAporte)==="EXTRAORDINARIA").reduce((a,m)=>a+m.amount,0);const other=received.filter(m=>m.kind==="Ingreso").reduce((a,m)=>a+m.amount,0);return {receivedTotal:received.reduce((a,m)=>a+m.amount,0),paidTotal:paid.reduce((a,m)=>a+m.amount,0),annual,extra,other,treasuryIn:t.in,treasuryOut:t.out,treasuryBalance:t.in-t.out,presidentIn:p.in,presidentOut:p.out,presidentBalance:p.in-p.out,totalBalance:(t.in-t.out)+(p.in-p.out)}}

async function buildPDF(type,id){const o=await currentOrg(),ps=(await scopedPeople()).sort(sortName),ms=await scopedMoves(),f=financial(ms),lines=[];let title="Informe";if(type==="general"){title="Informe general de tesoreria";lines.push(`Organizacion: ${o.name} | Establecimiento: ${o.school||""} | Ano: ${o.year||""}`,`Saldo real Tesoreria: ${money(f.treasuryBalance)} | Saldo Presidenta: ${money(f.presidentBalance)} | Fondos totales: ${money(f.totalBalance)}`,`Obligatorias: ${money(f.annual)} | Extraordinarias: ${money(f.extra)} | Otros ingresos: ${money(f.other)}`,`Ingresos efectivos: ${money(f.receivedTotal)} | Egresos efectivos: ${money(f.paidTotal)}`,"","DETALLE DE MOVIMIENTOS");ms.forEach(m=>lines.push(`${dateOnly(m.date)} | ${m.kind} | ${m.tipoAporte||""} | ${m.concept} | ${m.fondo||""} | ${m.personName||""} | ${money(m.amount)}`))}else if(type==="people"){title="Informe de integrantes";lines.push(`Organizacion: ${o.name}`,"Orden alfabetico","");ps.forEach((p,i)=>lines.push(`${i+1}. ${p.name} | RUT ${p.rut||""} | Tutor ${p.tutor||""} | Tel ${p.phone||""} | Correo ${p.email||""} | Banco ${p.bank||""} | Cuenta ${p.accountNumber||""}`))}else if(type==="person"){const p=ps.find(x=>x.id===id);title="Informe "+(p?.name||"integrante");lines.push(`Organizacion: ${o.name}`,`Integrante: ${p?.name||""} | RUT ${p?.rut||""}`,`Tutor: ${p?.tutor||""} | Telefono: ${p?.phone||""}`,`Banco: ${p?.bank||""} | Cuenta: ${p?.accountNumber||""}`,"","OBLIGATORIAS");ms.filter(m=>m.personId===id&&m.kind==="Aporte"&&norm(m.tipoAporte)==="ANUAL").forEach(m=>lines.push(`${dateOnly(m.date)} | ${m.concept} | ${m.fondo||""} | ${money(m.amount)}`));lines.push("","EXTRAORDINARIAS");ms.filter(m=>m.personId===id&&m.kind==="Aporte"&&norm(m.tipoAporte)==="EXTRAORDINARIA").forEach(m=>lines.push(`${dateOnly(m.date)} | ${m.concept} | ${m.fondo||""} | ${money(m.amount)}`));lines.push("","OTROS INGRESOS Y EGRESOS");ms.filter(m=>m.personId===id&&(m.kind==="Ingreso"||m.kind==="Egreso")).forEach(m=>lines.push(`${dateOnly(m.date)} | ${m.kind} | ${m.concept} | ${m.fondo||""} | ${money(m.amount)}`))}else if(type==="mandatory"||type==="extra"){const ex=type==="extra";title=ex?"Informe de cuotas extraordinarias":"Informe de cuotas obligatorias mensuales";const data=ms.filter(m=>m.kind==="Aporte"&&norm(m.tipoAporte)===(ex?"EXTRAORDINARIA":"ANUAL"));lines.push(`Organizacion: ${o.name}`,"");data.forEach(m=>lines.push(`${dateOnly(m.date)} | ${m.personName||""} | ${m.concept||""} | ${m.fondo||""} | ${money(m.amount)} | ${m.estado||""}`));lines.push("",`TOTAL: ${money(data.reduce((a,m)=>a+m.amount,0))}`)}else{title="Planilla GENERAL";lines.push(`Organizacion: ${o.name}`,"N° | RUT | INTEGRANTE | MAR | ABR | MAY | JUN | JUL | AGO | SEP | OCT | NOV | DIC | TOTAL OBLIG. | EXTRA. | TOTAL");ps.forEach((p,i)=>{const a=ms.filter(m=>m.personId===p.id&&m.kind==="Aporte"&&norm(m.tipoAporte)==="ANUAL"),e=ms.filter(m=>m.personId===p.id&&m.kind==="Aporte"&&norm(m.tipoAporte)==="EXTRAORDINARIA"),vals=monthsLocal.map(mon=>a.filter(m=>monthName(m.date,m.concept)===mon).reduce((s,m)=>s+m.amount,0)),ob=vals.reduce((s,v)=>s+v,0),ex=e.reduce((s,m)=>s+m.amount,0);lines.push(`${i+1} | ${p.rut||""} | ${p.name} | ${vals.map(v=>v?money(v):"-").join(" | ")} | ${money(ob)} | ${money(ex)} | ${money(ob+ex)}`)})}return makeSimplePDF(title,lines,type==="plan"||type==="people")}
function reportFilename(type,id){const o=currentOrg();return o.then(async org=>{if(type==="person"){const p=await get("people",id);return `Informe_${slug(p?.name||"integrante")}.pdf`}if(type==="people")return `Informe_Integrantes_${slug(org?.name||"tesoreria")}.pdf`;if(type==="mandatory")return `Informe_Obligatorias_${slug(org?.name||"tesoreria")}.pdf`;if(type==="extra")return `Informe_Extraordinarias_${slug(org?.name||"tesoreria")}.pdf`;if(type==="plan")return `Planilla_GENERAL_${slug(org?.name||"tesoreria")}.pdf`;return `Informe_General_${slug(org?.name||"tesoreria")}.pdf`})}
async function savePDF(filename,type,id){try{const blob=await buildPDF(type,id);download(blob,filename);toast("PDF guardado en Descargas")}catch(e){console.error(e);toast("No fue posible generar el PDF")}}
async function sharePDF(filename,type,id){try{const blob=await buildPDF(type,id);const file=new File([blob],filename,{type:"application/pdf"});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:filename.replace(/\.pdf$/i,""),text:"Informe de Tesorería",files:[file]});}else{download(blob,filename);toast("El teléfono no admite compartir archivos directamente. El PDF quedó en Descargas para compartirlo por WhatsApp o correo.")}}catch(e){if(e?.name!=="AbortError"){console.error(e);toast("No fue posible compartir el PDF")}}}
async function render(){renderNav();await refreshOrgs();if(!S.ready)return;const v=S.view;if(v==="inicio")return dashboard();if(v==="personas")return peopleView();if(v==="movimientos")return movesView();if(v==="cuotas")return feesView();if(v==="informes")return reportsView();return moreView()}
async function boot(){try{S.db=await openDB();S.ready=true;await refreshOrgs();await render()}catch(e){console.error(e);$("content").innerHTML=`<div class="empty">No se pudo iniciar la base local: ${esc(e.message)}</div>`}}
boot();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=4").catch(()=>{}));
</script>
