<html lang="es">
<head>

<title>Tesorería Multiorganizacional</title>
<style>
:root{--nav:#31444d;--nav2:#26363d;--orange:#ff5a00;--bg:#f3f5f6;--card:#fff;--line:#dce2e5;--text:#26343a;--muted:#738088;--ok:#168653;--danger:#bd3b32;--shadow:0 2px 10px #0000000d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{height:74px;background:var(--nav);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:19px;white-space:nowrap}.brandmark{width:46px;height:46px;border:3px solid var(--orange);border-radius:14px;display:grid;place-items:center}.brandmark svg{width:28px;height:28px}.orgsel{margin-left:auto;min-width:280px;height:48px;border:0;border-radius:13px;padding:0 14px;color:var(--text);background:#fff;font-weight:600}.refresh{width:48px;height:48px;border-radius:13px;border:1px solid #aab7bd;background:#fff;color:var(--text);font-size:22px}.layout{display:flex;min-height:calc(100vh - 74px)}.main{flex:1;min-width:0;padding-bottom:88px}.content{max-width:1180px;margin:auto;padding:20px}.section-label{color:var(--orange);font-weight:800;letter-spacing:.12em;font-size:13px;text-transform:uppercase}.title{font-size:32px;line-height:1.08;margin:5px 0}.sub{color:var(--muted);font-size:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid var(--line);background:#eef2f4;color:var(--text);border-radius:12px;padding:12px 16px;font-weight:650}.btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}.btn.dark{background:var(--nav);color:#fff;border-color:var(--nav)}.btn.danger{color:var(--danger);border-color:#e0b8b4;background:#fff}.btn.small{padding:8px 11px;font-size:13px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-height:128px}.kpi .label{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.05em}.kpi .value{font-size:28px;font-weight:800;margin-top:8px}.kpi.ok .value{color:var(--ok)}.kpi.out .value{color:var(--danger)}.cards2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary{border:1px solid var(--line);border-radius:13px;padding:14px}.summary span{display:block;color:var(--muted);font-size:14px}.summary b{font-size:21px}.list{display:flex;flex-direction:column;gap:9px}.row{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px 16px;display:flex;gap:12px;align-items:center}.rowmain{min-width:0;flex:1}.rowtitle{font-weight:750}.rowsub{color:var(--muted);font-size:13px;margin-top:3px}.rowamount{font-weight:800;white-space:nowrap}.in{color:var(--ok)}.out{color:var(--danger)}.rowactions{display:flex;gap:7px}.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted)}.iconbtn svg{width:19px;height:19px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:15px 0}.search{height:44px;border:1px solid var(--line);border-radius:11px;padding:0 12px;min-width:220px;background:#fff}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.tablewrap table{border-collapse:collapse;width:100%;min-width:1000px}.tablewrap th,.tablewrap td{padding:9px 10px;border-bottom:1px solid #edf0f1;text-align:left;font-size:13px;white-space:nowrap}.tablewrap th{background:var(--nav);color:#fff;position:sticky;top:0}.empty{background:#fff;border:1px dashed var(--line);border-radius:16px;padding:38px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:16px;z-index:50}.modal.open{display:grid}.modalbox{background:#fff;border-radius:18px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{border:0;background:#eef2f4;border-radius:10px;width:40px;height:40px;font-size:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.field textarea{min-height:80px;resize:vertical}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.nav{position:fixed;left:0;right:0;bottom:0;height:78px;background:var(--nav);display:flex;justify-content:center;gap:4px;z-index:30;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#c4cdd1;border-radius:13px;min-width:92px;max-width:150px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav button.active{background:var(--orange);color:#fff}.nav svg{width:24px;height:24px}.nav span{font-size:11px}.notice{padding:12px 14px;border-radius:12px;background:#fff1e8;border:1px solid #ffd0b5;margin:10px 0}.report{background:#fff;padding:28px;border-radius:16px;border:1px solid var(--line)}.report h1{margin:0 0 5px}.report .reportmeta{color:var(--muted);margin-bottom:20px}.report section{margin:20px 0}.report table{width:100%;border-collapse:collapse}.report th,.report td{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:12px}.report th{background:#edf1f2}.print-only{display:none}
@media print{body{background:#fff}.top,.nav,.no-print{display:none!important}.main{padding:0}.content{padding:0;max-width:none}.report{border:0;border-radius:0;padding:0}.print-only{display:block}.report table{min-width:0}.report th{background:#eee!important;color:#000!important}.report{page-break-inside:auto}.report section{page-break-inside:auto}}
@media(max-width:760px){.top{height:74px;padding:10px 12px}.brand span{display:none}.orgsel{min-width:0;flex:1}.grid4{grid-template-columns:1fr 1fr}.cards2{grid-template-columns:1fr}.content{padding:14px}.title{font-size:28px}.nav button{min-width:0}.nav span{font-size:10px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.kpi{min-height:115px}.kpi .value{font-size:24px}.row{align-items:flex-start;flex-wrap:wrap}.rowactions{margin-left:auto}.search{width:100%}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M7 4h10v16H7z"/><path d="M9 10h6M9 13h6M9 16h4"/></svg></div><span>Tesorería</span></div>
  <select id="orgSelect" class="orgsel"></select>
  <button id="refreshBtn" class="refresh" title="Actualizar">↻</button>
</header>
<div class="layout"><main class="main"><div id="content" class="content"></div></main></div>
<nav class="nav" id="nav"></nav>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" id="modalClose">×</button></div><div id="modalBody"></div></div></div>
<input id="fileInput" type="file" accept=".json,application/json" hidden>
</div>
<script>
"use strict";
const DB="TesoreriaMultiorganizacional_v3", VER=3;
const STORES=["organizations","people","movements","settings","audit"];
const S={db:null,orgId:localStorage.getItem("tm_org")||"",view:localStorage.getItem("tm_view")||"inicio",ready:false};
const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(Number(n)||0);
const dateOnly=x=>String(x||"").slice(0,10);
const norm=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toUpperCase();
const sortName=(a,b)=>norm(a.name).localeCompare(norm(b.name),"es");
function toast(t){let e=document.createElement("div");e.textContent=t;e.style.cssText="position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#26343a;color:#fff;padding:12px 16px;border-radius:12px;z-index:100;font-weight:650";document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{let db=r.result;STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:"id"})})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function all(store){return new Promise((res,rej)=>{let r=S.db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function get(store,id){return new Promise((res,rej)=>{let r=S.db.transaction(store,"readonly").objectStore(store).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{let tx=S.db.transaction(store,"readwrite");tx.objectStore(store).put(obj);tx.oncomplete=()=>res(obj);tx.onerror=()=>rej(tx.error)})}
function del(store,id){return new Promise((res,rej)=>{let tx=S.db.transaction(store,"readwrite");tx.objectStore(store).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function audit(action,detail){await put("audit",{id:uid(),action,detail,at:new Date().toISOString()})}
async function orgs(){return (await all("organizations")).sort(sortName)}
async function currentOrg(){return get("organizations",S.orgId)}
async function scopedPeople(){return (await all("people")).filter(p=>(p.orgIds||[]).includes(S.orgId)).sort(sortName)}
async function scopedMoves(){return (await all("movements")).filter(m=>m.orgId===S.orgId).sort((a,b)=>dateOnly(b.date).localeCompare(dateOnly(a.date)))}
function icon(name){const m={home:"<path d='M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'/>",people:"<circle cx='9' cy='8' r='3'/><path d='M2 20c0-4 3-6 7-6s7 2 7 6'/><circle cx='17' cy='9' r='2'/><path d='M16 14c3 .3 5 2.3 5 6'/>",moves:"<path d='M4 7h16M4 12h11M4 17h16'/><path d='M16 9l4 3-4 3'/>",fees:"<rect x='4' y='3' width='16' height='18' rx='2'/><path d='M8 8h8M8 12h8M8 16h5'/>",reports:"<path d='M4 19V9M10 19V5M16 19v-8M3 19h17'/>",more:"<circle cx='5' cy='12' r='1.5'/><circle cx='12' cy='12' r='1.5'/><circle cx='19' cy='12' r='1.5'/>"};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${m[name]}</svg>`}
const navItems=[["inicio","Inicio","home"],["personas","Personas","people"],["movimientos","Movimientos","moves"],["cuotas","Cuotas","fees"],["informes","Informes","reports"],["mas","Más","more"]];
function renderNav(){$("nav").innerHTML=navItems.map(([v,t,i])=>`<button data-view="${v}" class="${S.view===v?"active":""}">${icon(i)}<span>${t}</span></button>`).join("");document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{S.view=b.dataset.view;localStorage.setItem("tm_view",S.view);render()})}
async function refreshOrgs(){let os=await orgs();let sel=$("orgSelect");sel.innerHTML=os.length?os.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join(""):`<option value="">Sin organizaciones</option>`;if(!os.some(o=>o.id===S.orgId))S.orgId=os[0]?.id||"";sel.value=S.orgId;localStorage.setItem("tm_org",S.orgId)}
$("orgSelect").onchange=async e=>{S.orgId=e.target.value;localStorage.setItem("tm_org",S.orgId);S.view="inicio";render()};
$("refreshBtn").onclick=()=>render();
$("modalClose").onclick=closeModal;$("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
function closeModal(){$("modal").classList.remove("open");$("modalBody").innerHTML=""}
function showModal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.add("open")}
function field(label,id,type="text",value="",extra=""){return `<div class="field"><label>${esc(label)}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function moveForm(kind="Ingreso",record=null){let people=awaitPeopleCache;let html=`<div class="formgrid">${field("Fecha","fdate","date",dateOnly(record?.date)||new Date().toISOString().slice(0,10),"required")}${field("Monto","famount","number",record?.amount||"","min='1' required")}${field("Concepto / categoría","fconcept","text",record?.concept||"","required")}${field("Medio","fmedio","text",record?.medio||"Efectivo")}${field("Responsable","fresp","text",record?.responsable||"")}${field("Autoriza","faut","text",record?.autoriza||"")}${field("Responsable del gasto","fgasto","text",record?.responsableGasto||"")}${field("Comprobante","fcomp","text",record?.comprobante||"")}${field("Respaldo","fback","text",record?.respaldo||"")}${field("Banco","fbank","text",record?.banco||"")}${field("Tipo de cuenta","ftipocta","text",record?.tipoCuenta||"")}${field("N° cuenta","fnumcta","text",record?.numCuenta||"")}${field("Titular cuenta","ftitular","text",record?.titularCuenta||"")}<div class="field full"><label>Integrante / beneficiario</label><select id="fperson"><option value="">— Ninguno —</option>${people.map(p=>`<option value="${p.id}" ${record?.personId===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div><div class="field full">${field("Observaciones","fobs","text",record?.observaciones||"")}</div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="saveMove">Guardar</button></div>`;showModal((record?"Editar ":"Nuevo ")+kind,html);$("saveMove").onclick=async()=>{let obj={...(record||{}),id:record?.id||uid(),orgId:S.orgId,date:$("fdate").value,amount:Number($("famount").value)||0,concept:$("fconcept").value.trim(),medio:$("fmedio").value.trim(),responsable:$("fresp").value.trim(),autoriza:$("faut").value.trim(),responsableGasto:$("fgasto").value.trim(),comprobante:$("fcomp").value.trim(),respaldo:$("fback").value.trim(),banco:$("fbank").value.trim(),tipoCuenta:$("ftipocta").value.trim(),numCuenta:$("fnumcta").value.trim(),titularCuenta:$("ftitular").value.trim(),personId:$("fperson").value||"",observaciones:$("fobs").value.trim(),kind};if(!obj.concept||obj.amount<=0){toast("Completa concepto y monto");return}await put("movements",obj);await audit(record?"editar":"crear",kind+": "+obj.concept);closeModal();render();toast("Movimiento guardado")}}
let awaitPeopleCache=[];
async function openMove(kind,rec){awaitPeopleCache=await scopedPeople();moveForm(kind,rec)}
async function personForm(record=null){let html=`<div class="formgrid">${field("Nombre completo","pname","text",record?.name||"","required")}${field("RUT","prut","text",record?.rut||"")}${field("Tutor / responsable","ptutor","text",record?.tutor||"")}${field("Teléfono","pphone","text",record?.phone||"")}${field("Correo","pemail","email",record?.email||"")}${field("Banco para reembolso","pbank","text",record?.bank||"")}${field("Tipo de cuenta","ptype","text",record?.accountType||"")}${field("N° cuenta","pnum","text",record?.accountNumber||"")}${field("Titular cuenta","pholder","text",record?.accountHolder||"")}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="savePerson">Guardar</button></div>`;showModal(record?"Editar integrante":"Nuevo integrante",html);$("savePerson").onclick=async()=>{let name=$("pname").value.trim();if(!name){toast("Ingresa el nombre");return}let obj={...(record||{}),id:record?.id||uid(),name,rut:$("prut").value.trim(),tutor:$("ptutor").value.trim(),phone:$("pphone").value.trim(),email:$("pemail").value.trim(),bank:$("pbank").value.trim(),accountType:$("ptype").value.trim(),accountNumber:$("pnum").value.trim(),accountHolder:$("pholder").value.trim(),orgIds:Array.from(new Set([...(record?.orgIds||[]),S.orgId]))};await put("people",obj);await audit(record?"editar":"crear","Integrante: "+name);closeModal();render();toast("Integrante guardado")}}
async function orgForm(record=null){let html=`<div class="formgrid">${field("Nombre de la organización","oname","text",record?.name||"","required")}${field("Tipo","otype","text",record?.type||"Curso")}${field("Establecimiento / institución","oschool","text",record?.school||"Escuela Palestina")}${field("Año","oyear","number",record?.year||2026)}${field("RUT organización","orut","text",record?.rut||"")}${field("Dirección","oaddr","text",record?.address||"")}${field("Correo","omail","email",record?.email||"")}${field("Teléfono","ophone","text",record?.phone||"")}${field("Representante","orep","text",record?.representative||"")}${field("Tesorero/a","otres","text",record?.treasurer||"")}${field("Banco","obank","text",record?.bank||"")}${field("Tipo de cuenta","octa","text",record?.accountType||"")}${field("N° cuenta","oncta","text",record?.accountNumber||"")}${field("Titular cuenta","oholder","text",record?.accountHolder||"")}</div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="saveOrg">Guardar</button></div>`;showModal(record?"Editar organización":"Nueva organización",html);$("saveOrg").onclick=async()=>{let name=$("oname").value.trim();if(!name){toast("Ingresa el nombre");return}let obj={...(record||{}),id:record?.id||uid(),name,type:$("otype").value.trim(),school:$("oschool").value.trim(),year:Number($("oyear").value)||2026,rut:$("orut").value.trim(),address:$("oaddr").value.trim(),email:$("omail").value.trim(),phone:$("ophone").value.trim(),representative:$("orep").value.trim(),treasurer:$("otres").value.trim(),bank:$("obank").value.trim(),accountType:$("octa").value.trim(),accountNumber:$("oncta").value.trim(),accountHolder:$("oholder").value.trim()};await put("organizations",obj);S.orgId=obj.id;localStorage.setItem("tm_org",obj.id);await audit(record?"editar":"crear","Organización: "+name);closeModal();await refreshOrgs();render();toast("Organización guardada")}}
async function dashboard(){let o=await currentOrg();if(!o){$("content").innerHTML=`<div class="section-label">TESORERÍA</div><div class="title">Comienza desde cero</div><div class="sub">Crea una organización o importa el JSON base de Excel.</div><div class="actions"><button class="btn primary" id="newOrg">＋ Nueva organización</button><button class="btn" id="importTop">Importar JSON</button></div><div class="empty">La suite parte vacía. Los datos se cargan exclusivamente mediante JSON o mediante registro manual.</div>`;$("newOrg").onclick=()=>orgForm();$("importTop").onclick=()=>$("fileInput").click();return}
let [ps,ms]=await Promise.all([scopedPeople(),scopedMoves()]);let ins=ms.filter(m=>m.kind==="Ingreso"||m.kind==="Aporte").reduce((a,m)=>a+m.amount,0),outs=ms.filter(m=>m.kind==="Egreso"||m.kind==="Gasto"||m.kind==="Reembolso").reduce((a,m)=>a+m.amount,0),saldo=ins-outs, cuotas=ms.filter(m=>m.kind==="Aporte"&&norm(m.tipoAporte)==="ANUAL").reduce((a,m)=>a+m.amount,0),extra=ms.filter(m=>m.kind==="Aporte"&&norm(m.tipoAporte)==="EXTRAORDINARIA").reduce((a,m)=>a+m.amount,0),otrosIngresos=ms.filter(m=>m.kind==="Ingreso").reduce((a,m)=>a+m.amount,0);

const monthsLocal=["Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
function monthName(date,concept){
  const c=norm(concept);
  if(c && monthsLocal.some(m=>norm(m)===c)) return monthsLocal.find(m=>norm(m)===c);
  const d=new Date(String(date||"")); if(!Number.isNaN(d.getTime())) return monthsLocal[d.getUTCMonth()-2]||"";
  return "";
}

async function importJSONFile(file){

  );
  const importedOrg=raw.organization||raw.organizacion||(raw.organizations&&raw.organizations[0]);
  const peopleSrc=Array.isArray(raw.people)?raw.people:(Array.isArray(raw.integrantes)?raw.integrantes:[]);
  let movesSrc=Array.isArray(raw.movements)?raw.movements:[];
  if(!movesSrc.length && (raw.ingresos||raw.egresos)){
    movesSrc=[...(raw.ingresos||[]).map(x=>({...x,TIPO:"Ingreso"})),...(raw.egresos||[]).map(x=>({...x,TIPO:"Egreso"}))];
  }
  if(!Array.isArray(peopleSrc)||!Array.isArray(movesSrc)) throw new Error("Formato JSON no reconocido");

  const orgName=importedOrg?.name||importedOrg?.["Nombre de la organización"]||"Organización importada";
  const orgType=importedOrg?.type||importedOrg?.["Tipo de organización"]||"Curso";
  const orgSchool=importedOrg?.school||importedOrg?.["Establecimiento / institución"]||"";
  const orgYear=Number(importedOrg?.year||importedOrg?.["Año"]||2026);

  // La importación canónica reemplaza los datos de esa organización para evitar duplicados
  // y garantiza que los totales provengan exclusivamente de los 214 movimientos maestros.
  let os=await orgs();
  let o=os.find(x=>norm(x.name)===norm(orgName));
  if(o){
    for(const p of await all("people")) if((p.orgIds||[]).includes(o.id)) await del("people",p.id);
    for(const m of await all("movements")) if(m.orgId===o.id) await del("movements",m.id);
  }else{
    o={id:uid(),name:orgName,type:orgType,school:orgSchool,year:orgYear};
  }
  Object.assign(o,{name:orgName,type:orgType,school:orgSchool,year:orgYear});
  await put("organizations",o);
  S.orgId=o.id;
  localStorage.setItem("tm_org",o.id);

  const byKey=new Map(), byName=new Map();
  for(const x of peopleSrc){
    const name=x.name||x.nombre||x.NOMBRE||"";
    if(!name) continue;
    const rut=x.rut??x.RUT??"";
    const p={
      id:uid(),
      name:String(name).trim(),
      rut:String(rut??"").trim(),
      tutor:x.tutor??x["TUTOR / RESPONSABLE"]??x.TUTOR??"",
      phone:x.phone??x.telefono??x.TELÉFONO??"",
      email:x.email??x.correo??x.CORREO??"",
      bank:x.bank??x.BANCO??"",
      accountType:x.accountType??x["TIPO CUENTA"]??"",
      accountNumber:x.accountNumber??x["N° CUENTA"]??"",
      accountHolder:x.accountHolder??x["TITULAR CUENTA"]??"",
      holderRut:x.holderRut??x["RUT TITULAR"]??"",
      transferEmail:x.transferEmail??x["CORREO TRANSFERENCIA"]??"",
      roles:x.roles??x.ROLES??"",
      observations:x.observations??x.OBSERVACIONES??"",
      orgIds:[o.id]
    };
    await put("people",p);
    byName.set(norm(p.name),p);
    if(p.rut) byKey.set(norm(p.rut)+"|"+norm(p.name),p);
  }

  let added=0;
  for(const x of movesSrc){
    const rawKind=x.kind??x.tipo??x.TIPO??"";
    const kind=rawKind==="Aporte"?"Aporte":(rawKind==="Egreso"||rawKind==="Gasto"||rawKind==="Reembolso"?"Egreso":"Ingreso");
    const name=String(x.personName??x.person??x["PERSONA / BENEFICIARIO"]??"").trim();
    const rut=String(x.rut??x.RUT??"").trim();
    const p=byKey.get(norm(rut)+"|"+norm(name))||byName.get(norm(name));
    const fondo=x.fondo??x.FONDO??"";
    const actor=x.actor??x.responsable??x.RESPONSABLE??(String(fondo).toLowerCase().includes("president")?"Presidenta":"Tesorería");
    const amount=Number(x.amount??x.monto??x.MONTO??0)||0;
    const obj={
      id:String(x.id??x.ID??uid()),
      orgId:o.id,
      date:x.date??x.FECHA??"",
      kind,
      tipoAporte:x.tipoAporte??x["TIPO APORTE"]??"",
      concept:x.concept??x["CONCEPTO / CATEGORÍA"]??x.detalle??x.DETALLE??"Movimiento",
      fondo,
      medio:x.medio??x.MEDIO??"Efectivo",
      amount,
      personId:p?.id||"",
      personName:name,
      rut:rut||p?.rut||"",
      tutor:x.tutor??x["TUTOR / RESPONSABLE"]??(p?.tutor||""),
      responsable:actor||"",
      actor:actor||"",
      autoriza:x.autoriza??x.AUTORIZA??"",
      responsableGasto:x.responsableGasto??x["RESPONSABLE DEL GASTO"]??"",
      banco:x.banco??x.BANCO??(p?.bank||""),
      tipoCuenta:x.tipoCuenta??x["TIPO CUENTA"]??(p?.accountType||""),
      numCuenta:x.numCuenta??x["N° CUENTA"]??(p?.accountNumber||""),
      titularCuenta:x.titularCuenta??x["TITULAR CUENTA"]??(p?.accountHolder||""),
      comprobante:x.comprobante??x.COMPROBANTE??"",
      respaldo:x.respaldo??x.RESPALDO??"Carga masiva desde Excel",
      estado:x.estado??x.ESTADO??"Registrado",
      observaciones:x.observaciones??x.OBSERVACIONES??""
    };
    await put("movements",obj);
    added++;
  }

  await audit("importar",`Importación canónica: ${peopleSrc.length} personas y ${added} movimientos`);
  await refreshOrgs();
  S.view="inicio";
  await render();
  const t=await scopedMoves();
  const aportes=t.filter(m=>m.kind==="Aporte");
  const ingresos=t.filter(m=>m.kind==="Ingreso");
  const egresos=t.filter(m=>m.kind==="Egreso");
  const anual=aportes.filter(m=>norm(m.tipoAporte)==="ANUAL").reduce((a,m)=>a+m.amount,0);
  const extra=aportes.filter(m=>norm(m.tipoAporte)==="EXTRAORDINARIA").reduce((a,m)=>a+m.amount,0);
  const otros=ingresos.reduce((a,m)=>a+m.amount,0);
  const gastos=egresos.reduce((a,m)=>a+m.amount,0);
  toast(`Importado: ${peopleSrc.length} personas · ${added} movimientos · Cuotas ${money(anual)} · Extra ${money(extra)} · Otros ingresos ${money(otros)} · Egresos ${money(gastos)}`);
}
$("fileInput").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{await importJSONFile(f)}catch(err){console.error(err);toast("JSON inválido: "+err.message)}e.target.value=""}
async function wipe(){if(!confirm("¿Borrar toda la suite local? Esta acción no se puede deshacer."))return;for(let s of STORES){for(let x of await all(s))await del(s,x.id)}S.orgId="";localStorage.removeItem("tm_org");S.view="inicio";await refreshOrgs();render();toast("Suite borrada")}
async function render(){renderNav();await refreshOrgs();if(!S.ready)return;let v=S.view;if(v==="inicio")return dashboard();if(v==="personas")return peopleView();if(v==="movimientos")return movesView();if(v==="cuotas")return feesView();if(v==="informes")return reportsView();return moreView()}
async function boot(){try{S.db=await openDB();S.ready=true;await refreshOrgs();render()}catch(e){$("content").innerHTML=`<div class="empty">No se pudo iniciar la base local: ${esc(e.message)}</div>`}}
boot();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
