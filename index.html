<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183b59">
<link rel="manifest" href="manifest.webmanifest">
<title>Tesorería Multiorganizacional</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#1d2939}
header{background:#183b59;color:#fff;padding:14px 18px 16px;position:sticky;top:0;z-index:5}
.brand{font-size:22px;font-weight:800}.sub{opacity:.8;margin-top:3px;font-size:14px}
nav{background:#fff;display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid #d8e0e8;position:sticky;top:76px;z-index:4;padding:8px}
nav button{border:0;background:#fff;color:#667085;padding:10px 12px;border-radius:18px;white-space:nowrap;font-size:14px}
nav button.active{background:#e9f1ff;color:#245bc7;font-weight:700}
main{max-width:1050px;margin:auto;padding:18px 14px 100px}.hero h1{font-size:34px;margin:8px 0}.hero p{color:#667085;font-size:18px;margin:0 0 16px}
.card{background:#fff;border:1px solid #d9e1ea;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #1d29390b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.stat{padding:18px;border-radius:20px;background:#fff;border:1px solid #d9e1ea}.stat b{display:block;font-size:28px;margin-top:8px}.label{font-weight:800;color:#667085;font-size:13px;text-transform:uppercase;letter-spacing:.4px}
.btn{border:0;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#2d67dc;color:#fff}.orange{background:#f97316;color:#fff}.light{background:#edf2f6;color:#243142}.danger{background:#fee4e2;color:#b42318}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{font-weight:700;font-size:14px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:12px;margin-top:6px;font:inherit;background:#fff}textarea{min-height:90px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;vertical-align:top}th{background:#f8fafc}.scroll{overflow:auto}
.notice{padding:16px;border-radius:18px;background:#fff8e7;border:1px solid #f2c14e}.empty{padding:28px;text-align:center;color:#667085}
.small{font-size:13px;color:#667085}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#edf2ff;color:#245bc7;font-size:12px;font-weight:700}
footer{position:fixed;bottom:0;left:0;right:0;background:#183b59;color:#fff;text-align:center;padding:8px;font-size:12px}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}.hero h1{font-size:40px}}
@media print{header,nav,footer,.no-print{display:none!important}main{padding:0}.card{box-shadow:none;break-inside:avoid}body{background:#fff}}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.income{background:#e8f7ee;color:#147a45}.expense{background:#fff0ef;color:#b42318}.wide{max-width:980px!important}.bigbtn{padding:15px 20px;font-size:17px}.list{display:grid;gap:8px}.listrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid #e5e7eb;border-radius:14px;background:#fbfcfe}@media(max-width:699px){.sectionhead{align-items:flex-start}.sectionhead .btn{white-space:nowrap}}
</style>
</head>
<body>
<header><div class="brand">💰 Tesorería Multiorganizacional</div><div class="sub" id="orgHeader">Suite limpia · sin datos precargados</div></header>
<nav id="nav"></nav>
<main id="app"></main>
<footer>V5 · Datos locales en este dispositivo · Exporta una copia de seguridad periódicamente</footer>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script src="app.js"></script>
</body>
</html>
