-weight:850;color:#64748b;font-size:13px;text-transform:uppercase;letter-spacing:.5px}.small{font-size:13px;color:var(--muted);line-height:1.35}.btn{border:0;border-radius:14px;padding:12px 17px;font-size:16px;font-weight:800;cursor:pointer;min-height:46px}.btn.primary{background:var(--blue);color:#fff}.btn.orange{background:var(--orange);color:#fff}.btn.light{background:#edf2f6;color:#243142}.btn.danger{background:#fee4e2;color:#b42318}.bigbtn{padding-left:24px;padding-right:24px}.btnrow{display:flex;gap:10px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{font-weight:750;font-size:14px;display:block}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #cbd5e1;border-radius:12px;margin-top:6px;font:inherit;background:#fff;color:var(--ink);min-height:46px}select{appearance:auto}textarea{min-height:100px;resize:vertical}.notice{padding:22px;border-radius:22px;background:#fff8e7;border:1px solid #f2c14e;box-shadow:0 5px 18px #8a5a0010}.notice h2{font-size:26px;margin:0 0 8px}.notice p{font-size:17px;line-height:1.45;color:#475467;max-width:720px}.scroll{overflow:auto}.scroll table{min-width:920px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top}th{background:#f8fafc;color:#344054;font-weight:850;position:sticky;top:0}.empty{padding:32px;text-align:center;color:var(--muted);background:#f8fafc;border-radius:16px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.sectionhead h2{margin:0}.list{display:grid;gap:9px}.listrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fafcff}.check{display:flex;align-items:center;gap:8px;margin-top:12px}.check input{width:auto;min-height:auto;margin:0}.inset{background:#f8fafc;box-shadow:none;border-radius:16px}.
