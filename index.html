<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E274A"><meta name="description" content="Tesorería Pro · gestión integral de organizaciones, integrantes, cuotas, movimientos, reembolsos, informes y planillas."><link rel="manifest" href="./manifest.json"><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><title>Tesorería Pro · Super Suite</title><style>/* =====================================================================
   Tesorería Pro · hoja de estilos única
   Orden: 1 Tokens · 2 Base · 3 Estructura · 4 Navegación · 5 Componentes
          6 Iconos · 7 Tablas · 8 Fichas · 9 Formularios y diálogos
          10 Informes · 11 Respaldo Drive · 12 Responsive · 13 Impresión
   ===================================================================== */

/* ---------- 1 · Tokens ---------- */
:root{
  --bg:#F2F6FC; --surface:#fff; --surface2:#F5F8FD; --tint:#F3F7FD;
  --ink:#14243F; --ink-strong:#0E274A; --muted:#4B5D78;
  --line:#DCE7F7; --line-strong:#C4D8EE;
  --brand:#0E274A; --brand2:#2A4F8F; --blue-soft:#DCE8F8;
  --good:#12A06B; --warn:#E0A030; --danger:#D64545;
  --accent:var(--good); --money:var(--good); --purple:var(--brand2);
  --navy:#0E274A; --navy-2:#16345F; --night:#081A33; --on-dark:#C9D8F0;
  --circle:linear-gradient(135deg,#3A64A8,#2A4F8F);
  --grad-money:linear-gradient(135deg,#1FBF83,#12A06B);
  --grad-out:linear-gradient(135deg,#E2605F,#B93434);
  --grad-hero:linear-gradient(135deg,#16345F,#0E274A 60%,#0A1D38);
  --ok-bg:#DDF4E9; --ok-ink:#0C8456;
  --bad-bg:#FBE3E3; --bad-ink:#B93434;
  --amber-bg:#FBF0D8; --amber-ink:#8A5A00;
  --info-bg:#E4ECFA; --info-ink:#2A4F8F;
  --shadow:0 8px 24px rgba(14,39,74,.09); --r:20px;
}
body.dark{
  --bg:#071226; --surface:#0E1E38; --surface2:#132747; --tint:#132747;
  --ink:#EAF1FF; --ink-strong:#EAF1FF; --muted:#9FB2D3;
  --line:#1E3358; --line-strong:#2A4470;
  --brand:#7FA4FF; --brand2:#5B8CFF; --blue-soft:#17305A;
  --good:#34C98B; --warn:#E8B04A; --danger:#FF7B87;
  --ok-bg:rgba(52,201,139,.16); --ok-ink:#6EE0B0;
  --bad-bg:rgba(255,123,135,.16); --bad-ink:#FF9AA3;
  --amber-bg:rgba(232,176,74,.16); --amber-ink:#F0C675;
  --info-bg:rgba(91,140,255,.18); --info-ink:#9DBBFF;
  --shadow:0 10px 28px rgba(0,0,0,.35);
}

/* ---------- 2 · Base ---------- */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{overflow-x:hidden}
h1,h2,h3{letter-spacing:-.02em}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.hide{display:none!important}
.muted{color:var(--muted)}
.positive{color:var(--good)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--muted)}
.metric{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-top:6px;color:var(--ink-strong)}
.metric.positive{color:var(--money)}
.empty{text-align:center;padding:30px;color:var(--muted)}

/* ---------- 3 · Estructura ---------- */
.main{margin-left:244px;min-width:0}
.top{position:sticky;top:0;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 18px;background:rgba(242,246,252,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body.dark .top{background:rgba(7,18,38,.92)}
.top h1{margin:0;font-size:21px;font-weight:800;color:var(--ink-strong)}
.tools{display:flex;gap:8px;align-items:center}
.wrap{padding:20px;max-width:1500px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.span12{grid-column:span 12}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px;position:sticky;top:-18px;background:var(--surface);padding:4px 0 12px;z-index:5}
.sectionTitle h2,.sectionTitle h3{margin:0}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.toastBox{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:30px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:200;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toastBox.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 4 · Navegación ---------- */
/* menú lateral (escritorio) */
.side{position:fixed;left:0;top:0;bottom:0;width:244px;padding:18px 14px;z-index:20;color:#fff;background:linear-gradient(185deg,var(--navy),var(--night))}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 20px;font-weight:800;font-size:21px;letter-spacing:-.01em}
.brand small{display:block;margin-top:3px;font-size:11px;font-weight:500;color:#9FB2D3;letter-spacing:0}
.brandMark{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:800;color:#fff;background:var(--grad-money);box-shadow:0 6px 16px rgba(18,160,107,.35)}
.nav button{width:100%;display:flex;align-items:center;gap:11px;margin:4px 0;padding:10px 11px;border:0;border-radius:14px;background:transparent;color:#D5E2F8;font-weight:850}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.active{background:rgba(255,255,255,.10);color:#fff;box-shadow:inset 3px 0 0 #1FBF83}
.ico{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);color:#BFD0F2}
.ico .actionIconSvg{width:16px;height:16px}
.nav button.active .ico{background:var(--circle);color:#fff}
.nav .ico .actionGlyph[data-icon]{color:#CFE0F7}
.nav button.active .ico .actionGlyph[data-icon]{color:#fff}

/* barra inferior (celular): 5 columnas iguales */
.mobileNav{display:none}
.mobileNav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;height:58px;padding:4px 2px;border:0;border-radius:14px;background:transparent;color:var(--muted);font-size:10.5px;font-weight:700;line-height:1.1}
.mobileNav .navAction{display:grid;place-items:center;width:46px;height:28px;border-radius:14px}
.mobileNav .navAction .actionGlyph{width:20px;height:20px}
.mobileNav .actionIconSvg{width:20px;height:20px}
.mobileNav button span:last-child{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mobileNav button.active{color:var(--ink-strong)}
.mobileNav button.active .navAction{background:var(--blue-soft);color:var(--brand2)}
.mobileNav button.active span:last-child{font-weight:900}

/* ---------- 5 · Componentes ---------- */
/* botones */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 12px;border-radius:12px;font-weight:850;box-shadow:0 3px 10px rgba(0,0,0,.04)}
.btn.primary{background:var(--grad-money);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(18,160,107,.28)}
.btn.accent{background:var(--circle);color:#fff;border-color:transparent}
.btn.danger{color:var(--danger);border-color:var(--bad-bg)}
.btn.small{padding:7px 9px;font-size:12px}
.btn.primary .actionGlyph{color:#fff}
.iconOnlyBtn{width:42px;height:42px;padding:0;display:grid;place-items:center;border-radius:50%}
.iconOnlyBtn .actionIconSvg{width:21px;height:21px}
.iconOnlyBtn .actionGlyph{color:var(--ink-strong)}
.iconOnlyBtn.tinted{background:rgba(255,255,255,.14);border:0;color:#fff}
.iconOnlyBtn.tinted:hover{background:rgba(255,255,255,.26)}
.iconOnlyBtn.tinted .actionGlyph{color:#fff}
.rowbtn{border:0;background:var(--blue-soft);color:var(--brand);padding:7px 10px;border-radius:10px;font-weight:850}
.search{width:100%;border:1px solid var(--line);padding:12px 14px;border-radius:14px;outline:0;background:var(--surface);color:var(--ink)}
.search:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(42,79,143,.14)}

/* encabezado destacado del Panel */
.hero{position:relative;overflow:hidden;color:#fff;border:0;background:var(--grad-hero);box-shadow:0 12px 30px rgba(14,39,74,.25)}
.hero::after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-90px;top:-80px;background:rgba(255,255,255,.08);pointer-events:none}
.hero .muted{color:var(--on-dark)}
.heroTop{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative;z-index:1}
.heroKicker{color:#F7B15C}
.heroTitle{margin:6px 0;font-size:clamp(24px,4.5vw,32px);font-weight:800;color:#fff}
.heroMeta{color:var(--on-dark);font-size:13px}
.heroTools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.heroTool{width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(255,255,255,.12);color:#fff;transition:background .15s,transform .15s}
.heroTool:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
.heroTool .actionGlyph[data-icon]{width:20px;height:20px;color:#fff}
.heroTool .actionIconSvg{width:20px;height:20px}
.flowBar{height:8px;margin-top:16px;border-radius:99px;background:var(--danger);overflow:hidden;position:relative;z-index:1}
.flowBar span{display:block;height:100%;border-radius:99px;background:var(--grad-money)}
.flowLegend{display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--on-dark);position:relative;z-index:1}
.flowLegend i{display:inline-block;width:9px;height:9px;margin-right:6px;border-radius:50%}
.dotIn{background:#1FBF83}.dotOut{background:var(--danger)}

/* indicadores */
.kpi{position:relative;overflow:hidden;padding-left:22px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--brand2)}
.kpi.kIn::before{background:var(--good)}.kpi.kOut::before{background:var(--danger)}.kpi.kComm::before{background:var(--warn)}
.kIco{width:36px;height:36px;margin-bottom:10px;border-radius:50%;display:grid;place-items:center;background:var(--info-bg);color:var(--info-ink)}
.kIco .actionGlyph{width:18px;height:18px;color:inherit}
.kIco .actionIconSvg{width:18px;height:18px}
.kIn .kIco{background:var(--ok-bg);color:var(--ok-ink)}
.kOut .kIco{background:var(--bad-bg);color:var(--bad-ink)}
.kComm .kIco{background:var(--amber-bg);color:var(--amber-ink)}
.kOut .metric{color:var(--bad-ink)}

/* datos, etiquetas y avisos */
.detail{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:12px}
.detail b{display:block;margin-bottom:4px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.detailGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pill{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;background:var(--tint);color:var(--ink)}
.pill.good{background:var(--ok-bg);color:var(--ok-ink)}
.pill.bad{background:var(--bad-bg);color:var(--bad-ink)}
.pill.extra{background:var(--amber-bg);color:var(--amber-ink)}
.pill.refund,.reversalStatus{background:var(--info-bg);color:var(--info-ink)}
.reversalStatus{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900}
.notice{padding:12px 14px;border-radius:12px;background:var(--amber-bg);border:1px solid var(--warn);color:var(--amber-ink)}
.successBox{padding:12px 14px;border-radius:12px;background:var(--ok-bg);border:1px solid var(--good);color:var(--ok-ink)}
.bankBox{background:var(--tint);border:1px solid var(--line);border-radius:15px;padding:14px}
.bankBox b{color:var(--brand)}
.avatar{flex:0 0 42px;width:42px;height:42px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--blue-soft);color:var(--brand2);font-weight:900}
.avatar img{width:100%;height:100%;object-fit:cover}
.profileAvatar{flex-basis:72px;width:72px;height:72px;font-size:25px}
.person{display:flex;align-items:center;gap:10px}

/* contactos */
.contactsList{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.contactCard{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface)}
.contactCardHead{display:flex;align-items:center;gap:10px}
.contactName{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contactChips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.contactChip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer}
.contactChip:hover{border-color:var(--brand2);background:var(--blue-soft)}
.contactChip .actionGlyph{width:14px;height:14px}
.contactChip .actionIconSvg{width:13px;height:13px}
.contactGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.contactBlock{border:1px solid var(--line);border-radius:14px;padding:12px}
.contactBlock>b{display:block;margin-bottom:8px;color:var(--ink-strong);font-size:13px}
.contactBlock .detail{padding:6px 0;border:0;border-bottom:1px dashed var(--line);border-radius:0;background:none}
.contactBlock .detail:last-child{border-bottom:0}

/* ---------- 6 · Iconos ---------- */
.actionIconSvg{display:block;width:24px;height:24px;fill:currentColor}
.actionGlyph{display:grid;place-items:center;width:100%;height:27px;line-height:1}
/* color por significado */
.actionGlyph[data-icon="income"],.actionGlyph[data-icon="in"],.actionGlyph[data-icon="authorization"]{color:#2f8f67}
.actionGlyph[data-icon="expense"],.actionGlyph[data-icon="out"],.actionGlyph[data-icon="close"],.actionGlyph[data-icon="trash"]{color:var(--danger)}
.actionGlyph[data-icon="pdf"],.actionGlyph[data-icon="print"],.actionGlyph[data-icon="settings"],.actionGlyph[data-icon="organization"],.actionGlyph[data-icon="bank"]{color:var(--brand)}
.actionGlyph[data-icon="whatsapp"]{color:#25a35a}
.actionGlyph[data-icon="email"],.actionGlyph[data-icon="invoice"],.actionGlyph[data-icon="phone"]{color:#1971b8}
.actionGlyph[data-icon="edit"],.actionGlyph[data-icon="moves"]{color:#e28a22}
.actionGlyph[data-icon="ticket"]{color:#b8860f}
.actionGlyph[data-icon="attachment"],.actionGlyph[data-icon="copy"]{color:#5e7182}
.actionGlyph[data-icon="receipt"]{color:#0f6d91}
.actionGlyph[data-icon="report"]{color:var(--ok-ink)}
.actionGlyph[data-icon="refund"],.actionGlyph[data-icon="undo"],.actionGlyph[data-icon="people"],.actionGlyph[data-icon="responsible"],.actionGlyph[data-icon="home"],.actionGlyph[data-icon="calendar"],.actionGlyph[data-icon="plus"],.actionGlyph[data-icon="coins"],.actionGlyph[data-icon="more"],.actionGlyph[data-icon="cloud"]{color:var(--brand2)}
body.dark .actionGlyph[data-icon="pdf"],body.dark .actionGlyph[data-icon="print"],body.dark .actionGlyph[data-icon="settings"],body.dark .actionGlyph[data-icon="organization"],body.dark .actionGlyph[data-icon="bank"]{color:var(--brand)}
/* icono sobre círculo (títulos de sección) */
.headingIcon{display:inline-flex;margin-right:10px;vertical-align:-10px}
.headingIcon .actionGlyph{display:inline-grid;width:34px;height:34px;border-radius:50%;background:var(--circle);color:#fff}
.headingIcon .actionIconSvg{width:19px;height:19px}
/* botones de acción en tablas */
.rowActions,.quotaRowActions{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.quotaAction{display:inline-grid;place-items:center;width:33px;height:33px;padding:5px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--brand);transition:transform .12s}
.quotaAction:hover{transform:translateY(-1px);background:var(--blue-soft)}
.quotaAction .actionIconSvg{width:18px;height:18px}
.quotaAction:has([data-icon="edit"]){background:#fdf1e0;border-color:transparent}
.quotaAction:has([data-icon="pdf"]){background:#e8eef8;border-color:transparent}
.quotaAction:has([data-icon="whatsapp"]){background:#e5f7ea;border-color:transparent}
.quotaAction:has([data-icon="email"]){background:#e8f0fb;border-color:transparent}
.quotaAction:has([data-icon="undo"]){background:var(--info-bg);border-color:transparent}
.quotaAction:has([data-icon="trash"]){background:#fbe9ea;border-color:transparent}
.quotaAction:has([data-icon="check"]){background:#e7f4ec;border-color:transparent}
.quotaAction:has([data-icon="attachment"]){background:#eef0f2;border-color:transparent}
/* botones con icono y texto */
.actionGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.actionBtn{display:grid;place-items:center;gap:3px;min-width:0;min-height:64px;padding:7px 5px;border:1px solid var(--line-strong);border-radius:14px;background:linear-gradient(180deg,var(--surface),var(--surface2));color:var(--brand);font-weight:900;box-shadow:0 4px 12px rgba(14,39,74,.06);transition:.16s ease}
.actionBtn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(14,39,74,.10);border-color:var(--brand2)}
.actionBtn small{font-size:10px;color:var(--muted);font-weight:900;white-space:nowrap}
.actionBtn .actionIconSvg{width:27px;height:27px}
.actionBtn.compactAction{min-width:72px;min-height:48px}

/* ---------- 7 · Tablas ---------- */
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:16px}
.table{width:100%;border-collapse:collapse;min-width:760px}
.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;vertical-align:middle}
.table th{position:sticky;top:0;z-index:2;background:var(--blue-soft);color:var(--ink-strong);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.table th:last-child,.table td:last-child{min-width:210px}
.table tbody tr:hover{background:var(--tint)}
.statusSelect{min-width:104px;max-width:112px;padding:4px 6px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:12px}
.receiptBox{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border:1px solid var(--line-strong);border-radius:9px;background:var(--tint);color:var(--brand);font-weight:850;font-size:11px;cursor:pointer}
.receiptBox:hover{background:var(--blue-soft);border-color:var(--brand2)}
.receiptBox .actionIconSvg{width:15px;height:15px}
/* planillas */
.spreadsheet{overflow:auto;border:1px solid var(--line);border-radius:15px;background:var(--surface)}
.spreadsheet table{border-collapse:separate;border-spacing:0;min-width:1250px}
.spreadsheet th,.spreadsheet td{padding:10px 11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
.spreadsheet th{position:sticky;top:0;z-index:3;background:var(--blue-soft);color:var(--ink-strong);font-size:11px;text-transform:uppercase}
.spreadsheet .sticky{position:sticky;left:0;z-index:2;min-width:205px;background:var(--surface)}
.spreadsheet th.sticky{z-index:4;background:var(--blue-soft)}
.spreadsheet .totalRow th{background:var(--line);font-weight:900}
.spreadsheet .grandTotalCell{background:var(--line);font-weight:900}
.masterSheet td{font-size:13px}.masterSheet th{font-size:11px}
.masterSheet .totalRow th{position:sticky;bottom:0;z-index:5;color:var(--ink-strong)}
.blankcell{color:var(--muted);opacity:.6}
.sheetHint{margin-top:7px;font-size:12px;color:var(--muted)}

/* ---------- 8 · Fichas ---------- */
.fichaNameOnly{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:23px;font-weight:900;color:var(--brand)}
.fichaActions{margin:8px 0 20px}
.sectionHeaderActions{display:flex;align-items:center;gap:8px}
.fichaSection{margin-top:22px;border:1px solid var(--line);border-left:6px solid var(--brand2);border-radius:16px;padding:15px}
.fichaSection.monthly{border-left-color:var(--good);background:linear-gradient(180deg,var(--surface),var(--tint))}
.fichaSection.extraordinary{border-left-color:var(--warn);background:linear-gradient(180deg,var(--surface),var(--tint))}
.fichaSection.refunds,.fichaSection.reversals{border-left-color:var(--brand2);background:linear-gradient(180deg,var(--surface),var(--tint))}
.profileHero{display:flex;align-items:center;gap:15px;margin-bottom:14px;padding:16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,var(--blue-soft),var(--tint))}
.fichaHero{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;margin-bottom:12px;padding:16px;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--navy-2),var(--navy))}
.fichaHeroTop{display:flex;align-items:center;gap:14px}
.fichaHero .avatar{background:rgba(255,255,255,.16);color:#fff}
.fichaHeroInfo{flex:1;min-width:0}
.fichaHeroName{font-size:19px;font-weight:900;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function calc(){
  const active=moves().filter(m=>!['Revertido','Anulado'].includes(String(m.status||'')));
  const inc=active.filter(m=>['Aporte','Ingreso'].includes(m.type)).reduce((a,m)=>a+Number(m.amount||0),0);
  const exp=active.filter(m=>m.type==='Egreso'||m.type==='Reembolso').reduce((a,m)=>a+Number(m.amount||0),0);
  const real=active.filter(m=>m.fund==='Tesorería').reduce((a,m)=>a+(['Egreso','Reembolso'].includes(m.type)?-1:1)*Number(m.amount||0),0);
  const pres=active.filter(m=>m.fund==='Presidenta').reduce((a,m)=>a+(['Egreso','Reembolso'].includes(m.type)?-1:1)*Number(m.amount||0),0);
  return {inc,exp,committed:inc-exp,real,pres,totalFunds:real+pres};
}
function formatRut(value){
  let v=String(value||'').toUpperCase().replace(/[^0-9K]/g,'');
  if(!v)return '';
  if(v.length<8)return v;
  const dv=v.slice(-1); let body=v.slice(0,-1);
  let out=''; while(body.length>3){out='.'+body.slice(-3)+out;body=body.slice(0,-3)} out=body+out;
  return out+'-'+dv;
}

function contactVCard(c){
 const lines=['BEGIN:VCARD','VERSION:3.0',`FN:${c.name}`,`N:${c.name};;;;`];
 if(c.kind)lines.push(`TITLE:${c.kind}${c.related?' de '+c.related:''}`);
 if(c.mobile)lines.push(`TEL;TYPE=CELL:${c.mobile}`);
 if(c.phone)lines.push(`TEL;TYPE=HOME:${c.phone}`);
 if(c.whatsapp)lines.push(`TEL;TYPE=WORK:${c.whatsapp}`);
 if(c.email)lines.push(`EMAIL:${c.email}`);
 if(c.address||c.commune)lines.push(`ADR;TYPE=HOME:;;${c.address||''};${c.commune||''};;;Chile`);
 if(c.orgs?.length)lines.push(`ORG:${c.orgs.join(' / ')}`);
 if(c.rut)lines.push(`NOTE:RUT ${c.rut}`);
 lines.push('END:VCARD');
 return lines.join('\r\n');
}

async function importContactsVCF(){

 const text=await f.text();
 const cards=text.split(/BEGIN:VCARD/i).slice(1);
 let created=0;
 cards.forEach(block=>{
  const get=re=>{const m=block.match(re);return m?m[1].trim():''};
  const name=get(/FN:(.*)/i);
  if(!name)return;
  const phone=get(/TEL[^:]*CELL[^:]*:(.*)/i)||get(/TEL:(.*)/i);
  const email=get(/EMAIL[^:]*:(.*)/i);
  if(people().some(p=>p.name.trim().toUpperCase()===name.trim().toUpperCase()))return;
  const p={id:uid('P'),name,rut:'',email,roles:'Integrante',address:'',commune:'',phone:'',mobile:phone,whatsapp:'',telegram:'',instagram:'',facebook:'',tiktok:'',threads:'',bank:'',accountType:'',accountNumber:'',accountHolder:'',accountRut:'',refundEmail:'',photo:'',organizationIds:[data.organization.id]};
  data.people.push(p);created++;
 });
 persist();
 $('vcfFile').value='';
 toast(`${created} contacto(s) importado(s) como integrantes nuevos`);
 renderContacts();
}

const FIXED_CONTRIBUTION_TYPES=['anual','semestral','trimestral','fija','otra fija'];
function contributionTypeKey(c){return String(c?.contributionType||c?.kind||'').trim().toLowerCase();}
function isMonthlyContribution(c){
  const t=contributionTypeKey(c);
  if(t==='extraordinaria') return false;
  if(t==='mensual'||t==='obligatoria'||String(c?.kind||'').toLowerCase()==='mensual') return true;
  const n=Number(c?.month||c?.mes||0);
  if(n>=1&&n<=12){
    const concept=String(c?.concept||'').trim().toLowerCase();
    const monthName=MONTH_NAMES[n-1]?.toLowerCase()||'';
    if(concept===monthName || concept===`cuota ${monthName}` || concept.includes(`cuota mensual ${monthName}`)) return true;
  }
  return false;
}
function isFixedContribution(c){
  const t=contributionTypeKey(c);
  return !isMonthlyContribution(c) && FIXED_CONTRIBUTION_TYPES.includes(t) && t!=='extraordinaria';
}
function monthlyRecord(p,n){
  return personContribsAllOrgs(p).filter(c=>Number(c.month||c.mes||0)===n && isMonthlyContribution(c))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];
}

let reportMode='general';


function reportExtraConcepts(){
 const set=new Set();
 contribs().filter(c=>String(c.contributionType||'').toLowerCase()==='extraordinaria' && Number(c.amount||0)>0).forEach(c=>{if(c.concept)set.add(String(c.concept).trim())});
 return [...set];
}
function reportAmount(v){return Number(String(v||'').replace(/[^0-9-]/g,''))||0}
function reportExtraTotal(p,concept){return personContribsAllOrgs(p).filter(c=>String(c.contributionType||'').toLowerCase()==='extraordinaria' && String(c.concept||'').trim()===concept).reduce((a,c)=>a+Number(c.amount||0),0)}
function reportMonthTotal(p,n){const c=monthlyRecord(p,n);return c&&Number(c.amount||0)>0?Number(c.amount):0}
function reportRows(mode){
 const nums=configuredMonths(), extras=reportExtraConcepts();
 if(['income','expense','refund'].includes(mode)){
  const types=mode==='income'?['Ingreso','Aporte']:mode==='expense'?['Egreso']:['Reembolso'];
  return moves().filter(m=>types.includes(m.type) && Number(m.amount||0)>0 && !['Revertido','Anulado'].includes(String(m.status||''))).sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(m=>[m.date||'',m.type||'',m.concept||'',m.person||'',m.rut||findPerson(m.person)?.rut||'',m.fund||'',m.docType||'',m.docNumber||'',m.responsible||'',money(m.amount),m.receiptId||'']);
 }
 return people().map(p=>{
  const monthlyTotal=nums.reduce((a,n)=>a+reportMonthTotal(p,n),0);
  const extraVals=extras.map(c=>reportExtraTotal(p,c));
  const extraTotal=extraVals.reduce((a,v)=>a+v,0);
  if(mode==='monthly') return [p.name,p.rut||'',...nums.map(n=>reportMonthTotal(p,n)>0?money(reportMonthTotal(p,n)):''),monthlyTotal>0?money(monthlyTotal):''];
  if(mode==='extra') return [p.name,p.rut||'',...extraVals.map(v=>v>0?money(v):''),extraTotal>0?money(extraTotal):''];
  return [p.name,p.rut||'',...extraVals.map(v=>v>0?money(v):''),...nums.map(n=>reportMonthTotal(p,n)>0?money(reportMonthTotal(p,n)):''), (monthlyTotal+extraTotal)>0?money(monthlyTotal+extraTotal):''];
 });
}

{actionIcon('email',true)}</button><button class="quotaAction" title="Revertir" onclick="reverseMovement('${esc(m.id)}')">${actionIcon('undo')}</button><button class="quotaAction" title="Eliminar" onclick="deleteMovement('${esc(m.id)}')">${actionIcon('trash')}</button>`:''}</span></td></tr>`}).join('')||'<tr><td colspan="9" class="empty">No hay reembolsos.</td></tr>'}</tbody></table></div></section>`;

/* ===== Cuotas atrasadas, comprobante con saldo y resumen mensual ===== */
const NO_DUE=['EXIMIDO','NO PARTICIPA','NO APLICA'];
function dueUpto(){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1;return YEAR<y?12:YEAR>y?0:m}
function quotaAmountFor(n){const c=(data.quotaConfigs||[]).find(q=>q.active!==false&&String(q.type||'').toLowerCase()==='mensual'&&Number(q.year||YEAR)===YEAR&&n>=Number(q.startMonth||1)&&n<=Number(q.endMonth||12));return Number(c&&c.amount)||0}
function waPhone(raw){let d=String(raw||'').replace(/\D/g,'');if(d.length===9&&d[0]==='9')d='56'+d;else if(d.length===8)d='569'+d;return d.length>=11?d:''}
function personDebt(p,upto){upto=upto==null?dueUpto():upto;const months=[];
 configuredMonths().filter(n=>n<=upto).forEach(n=>{const r=monthlyRecord(p,n),st=r?String(r.status||'').toUpperCase():'';if(NO_DUE.includes(st))return;if(r&&Number(r.amount)>0&&st!=='PENDIENTE')return;months.push({n,name:MONTH_NAMES[n-1],amount:quotaAmountFor(n)})});
 return {months,total:months.reduce((a,m)=>a+m.amount,0)}}
function arrearsList(upto){return people().map(p=>({p,debt:personDebt(p,upto)})).filter(x=>x.debt.total>0||x.debt.months.length).sort((a,b)=>b.debt.total-a.debt.total||String(a.p.name).localeCompare(String(b.p.name),'es'))}
function orgName(){return data.organization?.['Nombre de la organización']||'la organización'}
function treasurerName(){return data.organization?.['Tesorero/a']||data.settings?.tesoreroGeneral?.name||''}
function debtText(debt){return debt.months.length?debt.months.map(m=>m.name).join(', '):''}
function arrearsMessage(p,debt){const who=String(p.tutor||p.name||'').trim().split(/\s+/)[0]||'';const n=debt.months.length;
 return 'Hola'+(who?' '+who:'')+', te escribimos de la tesorería de '+orgName()+'. Te recordamos que '+p.name+' tiene '+n+' cuota'+(n===1?'':'s')+' pendiente'+(n===1?'':'s')+' ('+debtText(debt)+') por un total de '+money(debt.total)+'. ¿Nos confirmas cuándo podrías ponerte al día? Gracias.'+(treasurerName()?' '+treasurerName()+', Tesorería.':'')}
function receiptMsg(m,p){const debt=p?personDebt(p):{months:[],total:0};const who=String(p?.tutor||m.person||'').trim().split(/\s+/)[0]||'';
 return 'Hola'+(who?' '+who:'')+', te enviamos el comprobante '+(m.receiptId||'')+' por '+money(m.amount)+(m.concept?' ('+m.concept+')':'')+' de '+(m.person||'')+'. '+(p?(debt.total>0?'Saldo pendiente: '+money(debt.total)+' ('+debtText(debt)+').':'Está al día con sus cuotas. ¡Gracias!'):'')}
function sendWA(phoneRaw,text){const ph=waPhone(phoneRaw);if(!ph)toast('Sin teléfono válido: se abre WhatsApp para elegir el contacto');window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(text),'_blank','noopener')}
function openArrears(){const L=arrearsList(),tot=L.reduce((a,x)=>a+x.debt.total,0);
 $('dialog').innerHTML=`<div class="sectionTitle"><div><h2>Cuotas atrasadas</h2><div class="muted">${L.length} integrante${L.length===1?'':'s'} · ${money(tot)} adeudado hasta ${MONTH_NAMES[Math.max(0,dueUpto()-1)]||'—'}</div></div><button class="btn" onclick="closeModal()">${actionIcon('close',true)} Cerrar</button></div>`+
 (L.length?`<div class="arrearsList">${L.map(x=>`<div class="settingsItem"><div><b>${esc(x.p.name)}</b><small>${esc(x.p.tutor?'Apoderado: '+x.p.tutor+' · ':'')}${esc(debtText(x.debt))} · <b>${money(x.debt.total)}</b>${waPhone(x.p.phone)?'':' · sin teléfono'}</small></div><span class="rowActions"><button class="quotaAction" title="WhatsApp" aria-label="Enviar recordatorio por WhatsApp" onclick="arrearsWA('${esc(x.p.id)}')">${actionIcon('whatsapp')}</button><button class="quotaAction" title="Copiar mensaje" aria-label="Copiar mensaje" onclick="arrearsCopy('${esc(x.p.id)}')">${actionIcon('copy')}</button></span></div>`).join('')}</div><div class="dialogActions"><button class="actionBtn" onclick="arrearsCSV()">${actionIcon('copy')}<small>Excel/CSV</small></button></div>`:`<div class="empty">No hay cuotas atrasadas. ¡Todos al día!</div>`);
 openModal()}
function arrearsWA(id){const p=people().find(x=>x.id===id);if(!p)return;sendWA(p.phone,arrearsMessage(p,personDebt(p)))}
function arrearsCopy(id){const p=people().find(x=>x.id===id);if(!p)return;const t=arrearsMessage(p,personDebt(p));try{navigator.clipboard.writeText(t).then(()=>toast('Mensaje copiado'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}}
function arrearsCSV(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const rows=arrearsList().map(x=>[x.p.name,x.p.rut||'',x.p.tutor||'',x.p.phone||'',debtText(x.debt),x.debt.months.length,x.debt.total]);
 const csv=[['Integrante','RUT','Apoderado','Teléfono','Meses adeudados','Cuotas','Total'].map(q).join(';')].concat(rows.map(r=>r.map(q).join(';'))).join('\n');download(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),'Cuotas_atrasadas_'+YEAR+'.csv')}
function openMonthlySummary(){const cur=Math.min(12,Math.max(1,dueUpto()||new Date().getMonth()+1));
 $('dialog').innerHTML=`<div class="sectionTitle"><div><h2>Resumen mensual en PDF</h2><div class="muted">Ingresos, egresos, saldos por caja, movimientos del mes y cuotas pendientes.</div></div><button class="btn" onclick="closeModal()">${actionIcon('close',true)} Cerrar</button></div><div class="field"><label for="sumMonth">Mes</label><select id="sumMonth">${MONTH_NAMES.map((m,i)=>`<option value="${i+1}" ${i+1===cur?'selected':''}>${m} ${YEAR}</option>`).join('')}</select></div><div class="dialogActions"><button class="actionBtn" onclick="pdfMonthlySummary(Number($('sumMonth').value))">${actionIcon('pdf')}<small>Generar PDF</small></button></div>`;openModal()}
function monthlySummaryData(n){const ym=YEAR+'-'+String(n).padStart(2,'0');const act=moves().filter(m=>!['Revertido','Anulado'].includes(String(m.status||'')));const inM=act.filter(m=>String(m.date||'').slice(0,7)===ym);
 const sum=(a,f)=>a.reduce((t,m)=>t+(f(m)?Number(m.amount||0):0),0);const isOut=m=>['Egreso','Reembolso'].includes(m.type);
 const inc=sum(inM,m=>!isOut(m)),exp=sum(inM,isOut);const end=ym+'-31';const names=[...new Set(['Tesorería','Presidenta',...(data.accounts||[]).map(a=>a.name).filter(Boolean)])];
 const boxes=names.map(nm=>[nm,act.filter(m=>m.fund===nm&&String(m.date||'')<=end).reduce((t,m)=>t+(isOut(m)?-1:1)*Number(m.amount||0),0)]);
 const arrears=arrearsList(n);return {ym,inM:inM.sort((a,b)=>String(a.date).localeCompare(String(b.date))),inc,exp,boxes,arrears}}
function pdfMonthlySummary(n){n=n||dueUpto()||1;const d=monthlySummaryData(n),mes=MONTH_NAMES[n-1]+' '+YEAR,sub=orgName()+' · Generado el '+new Date().toLocaleDateString('es-CL');
 const chunk=(a,k)=>{const o=[];for(let i=0;i<a.length;i+=k)o.push(a.slice(i,i+k));return o};const pages=[];
 pages.push(x=>{pageTitle(x,'Resumen mensual · '+mes,sub);drawTable(x,['Concepto','Monto'],[['Ingresos del mes',money(d.inc)],['Egresos y reembolsos del mes',money(d.exp)],['Resultado del mes',money(d.inc-d.exp)],['Movimientos del mes',String(d.inM.length)],...d.boxes.map(b=>['Saldo caja «'+b[0]+'» al cierre',money(b[1])]),['Saldo total al cierre',money(d.boxes.reduce((t,b)=>t+b[1],0))]],420,[1000,420])});
 chunk(d.inM.map(m=>[m.date,m.type,m.concept||'',m.person||'',money(m.amount),m.receiptId||'']),12).forEach((part,i)=>pages.push(x=>{pageTitle(x,'Movimientos de '+mes+(i?' (cont.)':''),sub);drawTable(x,['Fecha','Tipo','Concepto','Integrante','Monto','Comprobante'],part,420,[125,175,500,315,160,185])}));
 const ar=d.arrears.map(a=>[a.p.name,a.p.tutor||'',debtText(a.debt),money(a.debt.total)]);
 (ar.length?chunk(ar,14):[[]]).forEach((part,i)=>pages.push(x=>{pageTitle(x,'Cuotas pendientes al cierre de '+MONTH_NAMES[n-1],ar.length?ar.length+' integrante(s) · '+money(d.arrears.reduce((t,a)=>t+a.debt.total,0))+' adeudado':'Todos los integrantes están al día');if(part.length)drawTable(x,['Integrante','Apoderado','Meses adeudados','Total'],part,420,[450,350,420,200])}));
 pdfCanvasPages('Tesorería · Resumen mensual',pages,'Resumen_'+MONTH_NAMES[n-1]+'_'+YEAR+'.pdf');closeModal()}

function reportPreview(mode){
 if(mode==='kpi'){const c=calc();return `<div class="reportSummary"><div class="detail"><b>Ingresos</b>${money(c.inc)}</div><div class="detail"><b>Egresos</b>${money(c.exp)}</div><div class="detail"><b>Saldo real</b>${money(c.real)}</div><div class="detail"><b>Saldo teórico</b>${money(c.committed)}</div></div><div class="sheetHint">Informe visual con los KPI del Panel (ingresos, egresos, saldos y distribución de fondos), pensado para compartir con las familias e integrantes. Se genera solo en PDF.</div>`}
 if(mode==='directory'){const rows=people().map(p=>[p.name||'',p.rut||'',p.roles||'Integrante',p.address||'',p.tutor||'',p.phone||'',p.email||'',p.bank||'',p.accountType||'',p.accountNumber||'',p.accountHolder||'',p.accountRut||'',p.refundEmail||'']);return `<div class="sheetHint">Planilla maestra horizontal con todos los datos de cada integrante: identificación, contacto, tutor/apoderado y cuenta para reembolsos.</div><div class="spreadsheet reportTableWrap masterSheet"><table><thead><tr><th class="sticky">Integrante</th><th class="sticky">RUT</th><th>Rol</th><th>Dirección</th><th>Tutor / Apoderado</th><th>Teléfono</th><th>Correo</th><th>Banco</th><th>Tipo de cuenta</th><th>N° de cuenta</th><th>Titular</th><th>RUT titular</th><th>Correo reembolso</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i<2?'sticky':''}">${esc(v||'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="13" class="empty">No hay integrantes.</td></tr>`}</tbody></table></div>`}
 if(['treasury-current','treasury-monthly','treasury-annual'].includes(mode)){const c=calc();const label=mode==='treasury-current'?'Actual':mode==='treasury-monthly'?'Mensual':'Anual';return `<div class="reportSummary"><div class="detail"><b>Ingresos</b>${money(c.inc)}</div><div class="detail"><b>Egresos</b>${money(c.exp)}</div><div class="detail"><b>Saldo actual</b>${money(c.real)}</div><div class="detail"><b>Informe</b>Resumen ${label} · PDF con detalle</div></div>`} const rows=reportRows(mode),nums=configuredMonths(),names=nums.map(n=>MONTH_NAMES[n-1]),extras=reportExtraConcepts();let headers;
 if(mode==='monthly')headers=['Integrante','RUT',...names,'Total alumno'];
 else if(mode==='extra')headers=['Integrante','RUT',...extras,'Total alumno'];
 else if(['income','expense','refund'].includes(mode))headers=['Fecha','Tipo','Concepto','Integrante','RUT','Cuenta','Documento','N° doc.','Responsable','Monto','Comprobante'];
 else headers=['Integrante','RUT',...extras,...names,'Total alumno'];
 let totals,grand=0;
 if(['income','expense','refund'].includes(mode)){totals=headers.slice(2).map((_,i)=>i===7?money(rows.reduce((s,r)=>s+reportAmount(r[9]),0)):'');grand=rows.reduce((s,r)=>s+reportAmount(r[9]),0)}
 else {totals=headers.slice(2).map((_,i)=>money(rows.reduce((s,r)=>s+reportAmount(r[i+2]),0)));grand=rows.reduce((s,r)=>s+reportAmount(r[r.length-1]),0)}
 return `<div class="sheetHint">Planilla completa en formato horizontal. Las celdas sin movimiento quedan en blanco. Los totales forman parte de la propia planilla y no se repiten en tarjetas externas.</div><div class="spreadsheet reportTableWrap masterSheet"><table><thead><tr>${headers.map((h,i)=>`<th class="${i<2?'sticky':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i<2?'sticky':''}">${esc(v||'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length}" class="empty">No hay datos.</td></tr>`}<tr class="totalRow"><th class="sticky">TOTALES</th><th class="sticky"></th>${totals.map((v,i)=>`<th>${v==='$0'?'':v}</th>`).join('')}</tr></tbody></table></div>`;
}

/* ===== Anular / reversar una cuota: la celda vuelve a blanco y los totales se recalculan ===== */
const KEEP_STATUS=['EXIMIDO','NO PARTICIPA','NO APLICA'];
function moveForContribution(c){const act=m=>!['Revertido','Anulado'].includes(String(m.status||''));
 if(c.moveId){const m=moves().find(x=>x.id===c.moveId);if(m)return m}
 const amt=Number(c.amount||0);if(!(amt>0))return null;
 const cand=moves().filter(m=>act(m)&&m.person===c.person&&Number(m.amount||0)===amt&&['Aporte','Ingreso'].includes(m.type));
 const isM=isMonthlyContribution(c);
 return (isM&&c.month&&cand.find(m=>Number(m.month||0)===Number(c.month)&&String(m.contributionType||'Mensual').toLowerCase()==='mensual'))
  ||cand.find(m=>String(m.concept||'').trim().toLowerCase()===String(c.concept||'').trim().toLowerCase())||null}
function unapplyContribution(c,status){if(!c)return;
 const m=moveForContribution(c);
 if(m&&!['Revertido','Anulado'].includes(String(m.status||''))){m.status=String(status||'').toUpperCase()==='REVERSA'?'Revertido':'Anulado';m.reversalDate=new Date().toISOString().slice(0,10);m.reversalReason=status||'Cuota dejada en blanco';m.modifiedAt=new Date().toISOString();m.modifiedBy='Usuario local'}
 if(Number(c.amount||0)>0){c.prevAmount=c.amount;c.prevDate=c.date||'';c.prevMoveId=m?m.id:(c.moveId||'');c.prevReceiptId=c.receiptId||(m&&m.receiptId)||''}
 c.amount=0;c.date='';c.moveId='';c.receiptId='';c.status=KEEP_STATUS.includes(status)?status:'';c.unappliedAt=new Date().toISOString()}
function restoreContribution(c){if(!c||!Number(c.prevAmount||0))return false;
 c.amount=c.prevAmount;c.date=c.prevDate||'';c.moveId=c.prevMoveId||'';c.receiptId=c.prevReceiptId||'';c.status='AL DÍA';
 const m=moves().find(x=>x.id===c.moveId);if(m&&['Revertido','Anulado'].includes(m.status)){m.status='Registrado';delete m.reversalDate;delete m.reversalReason}
 delete c.prevAmount;delete c.prevDate;delete c.prevMoveId;delete c.prevReceiptId;return true}
function healReversedContribs(){let ch=false;(data.contributions||[]).forEach(c=>{if(Number(c.amount||0)<=0)return;const m=c.moveId?moves().find(x=>x.id===c.moveId):null;
 if(['REVERSA','ANULADO','CANCELADO'].includes(String(c.status||'').toUpperCase())||(m&&['Revertido','Anulado'].includes(m.status))){unapplyContribution(c,'');ch=true}});return ch}
function setContributionStatus(cid,mid,status){
  const c=(data.contributions||[]).find(x=>x.id===cid);
  const _undo=['REVERSA','ANULADO','CANCELADO','PENDIENTE'].includes(status)||KEEP_STATUS.includes(status);
  if(c&&status==='AL DÍA'&&Number(c.amount||0)<=0&&restoreContribution(c)){persist();const _p=people().find(x=>x.name===c.person);if(_p)personDetail(_p.id);else render();return}
  if(c&&!_undo)c.status=status;
  if(mid&&_undo){const m=moves().find(x=>x.id===mid);if(m){m.status=status==='REVERSA'?'Revertido':'Anulado';m.reversalDate=new Date().toISOString().slice(0,10);m.reversalReason=status;m.modifiedAt=new Date().toISOString()}}
  else if(mid){
    const m=moves().find(x=>x.id===mid);
    if(m){
      if(status==='REVERSA')m.status='Revertido';
      else if(status==='ANULADO')m.status='Anulado';
      else if(status==='AL DÍA' && ['Revertido','Anulado'].includes(m.status))m.status='Registrado';
      m.modifiedAt=new Date().toISOString();m.modifiedBy='Usuario local';
    }
  }
  if(c&&_undo)unapplyContribution(c,status);
  persist();
  const personName=c?.person || (mid?moves().find(x=>x.id===mid)?.person:'');
  const p=people().find(x=>x.name===personName);
  if(p)personDetail(p.id);else render();
}
function quickMonthlyPayment(pid,n){
  const p=people().find(x=>x.id===pid);if(!p)return;
  let c=monthlyRecord(p,n);
  const cfg=(data.quotaConfigs||[]).find(q=>q.type==='mensual'&&n>=Number(q.startMonth||1)&&n<=Number(q.endMonth||12));
  const defaultAmount=Number(c?.amount||cfg?.amount||0);
  const value=prompt(`Monto cancelado de ${MONTH_NAMES[n-1]} para ${p.name}:`,String(defaultAmount||3000));
  if(value===null)return;
  const amount=Number(String(value).replace(/[^0-9]/g,''));
  if(!amount||amount<0){alert('Ingresa un monto válido.');return}
  if(!confirmSave(`¿Confirmas registrar ${money(amount)} como ingreso de la cuota de ${MONTH_NAMES[n-1]}?`))return;
  const today=new Date().toISOString().slice(0,10), id=uid('M');
  const m={id,date:today,organization:data.organization['Nombre de la organización'],organizationId:data.organization.id,type:'Ingreso',contributionType:'Mensual',concept:`Cuota mensual ${MONTH_NAMES[n-1]}`,fund:'Tesorería',method:'Transferencia',amount,person:p.name,rut:p.rut||'',tutor:p.tutor||'',status:'Registrado',notes:'Pago generado desde la ficha del integrante',receiptId:receiptId('Ingreso')};
  data.movements.push(m);
  if(!c){c={id:uid('C'),person:p.name,month:n,year:YEAR,date:today,concept:m.concept,fund:'Tesorería',amount,contributionType:'Mensual',status:'AL DÍA',moveId:id,kind:'mensual',organizationId:data.organization.id};data.contributions.push(c)}
  else{c.amount=amount;c.date=today;c.status='AL DÍA';c.moveId=id;c.kind='mensual';c.contributionType='Mensual';c.organizationId ||= data.organization.id}
  ensureMonthlyReceipt(c);
  persist();personDetail(pid);
}

function setMonthlyStatus(pid,n,status){
  const p=people().find(x=>x.id===pid);if(!p)return;
  let c=monthlyRecord(p,n);
  if(status==='AL DÍA'){
    if(c&&Number(c.amount)>0){c.status='AL DÍA';ensureMonthlyReceipt(c);persist();personDetail(pid);return}
    const cfg=(data.quotaConfigs||[]).find(q=>q.type==='mensual'&&n>=Number(q.startMonth||1)&&n<=Number(q.endMonth||12));
    const amount=Number(c?.amount||cfg?.amount||0);
    if(!amount){alert('Configura primero el monto de la cuota o ingrésalo desde el valor.');personDetail(pid);return}
    quickMonthlyPayment(pid,n);return;
  }
  if(!c){c={id:uid('C'),person:p.name,month:n,year:YEAR,date:'',concept:'',fund:'Tesorería',amount:0,contributionType:'Mensual',status,kind:'mensual',organizationId:data.organization.id};data.contributions.push(c)}
  else c.status=status;
  if(c.moveId){const m=moves().find(x=>x.id===c.moveId);if(m){if(['REVERSA','ANULADO','CANCELADO'].includes(status)){m.status=status==='REVERSA'?'Revertido':'Anulado';m.reversalDate=new Date().toISOString().slice(0,10);m.reversalReason=status;}else if(['PENDIENTE','EXIMIDO','NO PARTICIPA','NO APLICA',''].includes(status)){m.status='Anulado';m.reversalDate=new Date().toISOString().slice(0,10);m.reversalReason='Estado de cuota: '+status;}}}
  if(['REVERSA','ANULADO','CANCELADO','PENDIENTE','EXIMIDO','NO PARTICIPA','NO APLICA',''].includes(status)&&c.id)unapplyContribution(c,status);
  persist();personDetail(pid);
}

   const raw=u.slice(dataStart,dataStart+csize);

   if(method===0) bytes=raw;
   else if(method===8){
     if(!('DecompressionStream' in window))throw new Error('Este navegador no admite descompresión XLSX. Usa JSON o CSV.');
     const ds=new DecompressionStream('deflate-raw');bytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());

   if(usize && bytes.length!==usize){} // algunos libros usan tamaños no confiables
   out[name]=new TextDecoder('utf-8').decode(bytes);pos+=46+nlen+xlen+clen;

   }rows.push(vals);

}

function wrapText(ctx,text,maxWidth){
 const words=String(text??'').split(/\s+/);const lines=[];let line='';
 for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width<=maxWidth)line=test;else{if(line)lines.push(line);line=word}}
 if(line)lines.push(line);return lines.length?lines:[''];
}
function drawWrapped(ctx,text,x,y,maxWidth,lineHeight,maxLines=3){
 const lines=wrapText(ctx,text,maxWidth).slice(0,maxLines);lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));return y+lines.length*lineHeight;
}

 const ifr=document.createElement('iframe');
 ifr.style.position='fixed';ifr.style.left='-10000px';ifr.style.top='0';ifr.style.width='1100px';ifr.style.height='800px';ifr.style.border='0';
 document.body.appendChild(ifr);
 const doc=ifr.contentWindow.document;
 doc.open();doc.write(html);doc.close();
 ifr.onload=()=>{
  setTimeout(()=>{
   ifr.contentWindow.focus();
   ifr.contentWindow.print();
   setTimeout(()=>{if(ifr.parentNode)document.body.removeChild(ifr)},1500);
  },250);
 };

async function pdfReport(mode){
 if(mode==='kpi'){await pdfKpiSummary();return}
 if(mode==='directory'){pdfDirectory();return}
 if(['treasury-current','treasury-monthly','treasury-annual'].includes(mode)){await pdfTreasurySummary(mode.replace('treasury-',''));return}
 if(['income','expense','refund'].includes(mode)){
  printMovements(mode);
  return;
 } else pdfSheetLandscape(mode);
}

function drvSave(){try{localStorage.setItem(DRV_KEY,JSON.stringify(drv))}catch(e){}}
function drvSet(st,msg){drvState=st;drvMsg=msg||'';const b=document.getElementById('drvBtn');if(b){b.className='btn iconOnlyBtn drvBtn drv-'+st;b.title='Google Drive · '+drvLabel()}if(document.getElementById('drvPanel'))drvPanelRefresh()}
function drvLabel(){return({off:'sin conectar',ok:'respaldado',pending:'cambios pendientes de respaldar',busy:'guardando…',error:'error',conflict:'versión distinta en Drive'})[drvState]||''}
function drvWhen(iso){if(!iso)return 'nunca';const d=new Date(iso);if(isNaN(d))return 'desconocido';return d.toLocaleString('es-CL',{dateStyle:'medium',timeStyle:'short'})}
function drvMarkDirty(){if(!drvReady||!drv.connected)return;drv.dirty=true;drvSave();if(!drv.auto){drvSet('pending');return}drvSet('pending');clearTimeout(drvTimer);drvTimer=setTimeout(()=>drvBackup(),15000)}
function drvLoadGIS(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error('No se pudo cargar Google (¿sin conexión?)'));document.head.appendChild(s)})}
function drvToken(interactive){return new Promise(async(res,rej)=>{
 if(drv.token&&drv.exp>Date.now()+60000)return res(drv.token);
 if(!drv.clientId)return rej(new Error('Falta el ID de cliente'));
 try{await drvLoadGIS()}catch(e){return rej(e)}
 let done=false;const fin=(f,v)=>{if(done)return;done=true;f(v)};
 const tc=google.accounts.oauth2.initTokenClient({client_id:drv.clientId,scope:DRV_SCOPE,callback:r=>{if(r.error)return fin(rej,new Error(r.error_description||r.error));drv.token=r.access_token;drv.exp=Date.now()+(Number(r.expires_in)||3600)*1000;drv.connected=true;drvSave();fin(res,drv.token)},error_callback:e=>fin(rej,new Error('Autorización cancelada o bloqueada ('+(e&&e.type||'popup')+')'))});
 tc.requestAccessToken({prompt:interactive&&!drv.connected?'consent':''});
 if(!interactive)setTimeout(()=>fin(rej,new Error('Se necesita volver a autorizar')),8000);
})}
async function drvFetch(url,opt,interactive){opt=opt||{};const t=await drvToken(interactive);const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+t}});if(r.status===401){drv.token='';drv.exp=0;drvSave();throw new Error('La sesión de Google venció')}if(!r.ok)throw new Error('Drive '+r.status);return r}
async function drvFind(interactive){
 if(drv.fileId){try{const r=await drvFetch('https://www.googleapis.com/drive/v3/files/'+drv.fileId+'?fields=id,modifiedTime,trashed',{},interactive);const f=await r.json();if(!f.trashed)return f}catch(e){if(/Drive 404/.test(e.message)){drv.fileId='';drv.remoteMod=''}else throw e}}
 const q=encodeURIComponent("name='"+DRV_FILE+"' and trashed=false");
 const r=await drvFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,modifiedTime)&orderBy=modifiedTime%20desc&pageSize=1',{},interactive);
 const f=((await r.json()).files||[])[0]||null;if(f){drv.fileId=f.id;drvSave()}return f}
async function drvUpload(f,interactive){
 const body=JSON.stringify({app:'tesoreria-pro',version:1,savedAt:new Date().toISOString(),data});
 const bd='tes'+Date.now().toString(36);
 const meta=JSON.stringify(f?{}:{name:DRV_FILE,mimeType:'application/json'});
 const payload='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+body+'\r\n--'+bd+'--';
 const url=(f?'https://www.googleapis.com/upload/drive/v3/files/'+f.id:'https://www.googleapis.com/upload/drive/v3/files')+'?uploadType=multipart&fields=id,modifiedTime';
 const r=await drvFetch(url,{method:f?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:payload},interactive);
 const j=await r.json();drv.fileId=j.id;drv.remoteMod=j.modifiedTime;drv.lastBackupAt=j.modifiedTime||new Date().toISOString();drv.dirty=false;drvSave()}
async function drvBackup(opts){opts=opts||{};const interactive=!!opts.interactive,force=!!opts.force;
 if(drvBusy)return;drvBusy=true;drvSet('busy');clearTimeout(drvTimer);
 try{const f=await drvFind(interactive);
  if(f&&!force&&f.modifiedTime!==drv.remoteMod){drvSet('conflict');drvConflictModal(f);return}
  await drvUpload(f,interactive);drvSet('ok');if(interactive)toast('Respaldo guardado en Google Drive');
 }catch(e){console.warn(e);drvSet(interactive?'error':'pending',e.message);if(interactive)toast('No se pudo respaldar: '+e.message)}
 finally{drvBusy=false}}
async function drvRestore(f){
 try{const r=await drvFetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media',{},true);const obj=await r.json();const d=obj.data||obj;
  if(!(d&&d.people&&d.movements&&d.contributions))throw new Error('El archivo de Drive no es válido');
  try{localStorage.setItem('tesoreria-antes-de-restaurar',JSON.stringify(data))}catch(e){}
  data=d;normalize();drvReady=false;await saveLocal();
  drv.remoteMod=f.modifiedTime;drv.lastBackupAt=f.modifiedTime;drv.dirty=false;drvSave();
  toast('Datos restaurados desde Drive · recargando…');setTimeout(()=>location.reload(),900);
 }catch(e){console.warn(e);toast('No se pudo restaurar: '+e.message)}}
async function drvRestoreNow(){try{const f=await drvFind(true);if(!f){toast('No hay respaldo en Drive todavía');return}drvConfirmRestore(f)}catch(e){toast('No se pudo acceder a Drive: '+e.message)}}
function drvConfirmRestore(f){window._drvF=f;$('dialog').innerHTML='<div class="moreSheet"><h3>Restaurar desde Drive</h3><p class="muted">Se reemplazarán los datos de este dispositivo por el respaldo de Drive del <b>'+esc(drvWhen(f.modifiedTime))+'</b>. Antes se guarda una copia local de seguridad.</p><div class="drvBtns"><button class="btn primary" onclick="closeModal();drvRestore(window._drvF)">Sí, restaurar</button><button class="btn" onclick="closeModal()">Cancelar</button></div></div>';openModal()}
function drvConflictModal(f){window._drvF=f;
 if(!drv.dirty){$('dialog').innerHTML='<div class="moreSheet"><h3>Hay datos más recientes en Drive</h3><p class="muted">Se guardaron el <b>'+esc(drvWhen(f.modifiedTime))+'</b> desde otro dispositivo. Este equipo no tiene cambios sin respaldar, así que puedes cargarlos sin perder nada.</p><div class="drvBtns"><button class="btn primary" onclick="closeModal();drvRestore(window._drvF)">Cargar datos de Drive</button><button class="btn" onclick="closeModal()">Ahora no</button></div></div>';openModal();return}
 $('dialog').innerHTML='<div class="moreSheet"><h3>Hay una versión distinta en Drive</h3><p class="muted">Drive tiene un respaldo del <b>'+esc(drvWhen(f.modifiedTime))+'</b> que no viene de este dispositivo (por ejemplo, hecho desde tu PC o celular). Elige cuál conservar:</p><div class="drvBtns"><button class="btn primary" onclick="closeModal();drvRestore(window._drvF)">Usar la de Drive<small>Reemplaza los datos de este dispositivo</small></button><button class="btn" onclick="closeModal();drvBackup({force:true,interactive:true})">Usar la de este dispositivo<small>Sobrescribe Drive (queda en el historial de versiones)</small></button><button class="btn" onclick="closeModal()">Decidir después</button></div></div>';openModal()}
async function drvCheckRemote(){if(!drv.connected||drvBusy)return;
 try{const f=await drvFind(false);if(!f){if(drv.dirty||!drv.lastBackupAt)drvMarkDirty();else drvSet('ok');return}
  if(f.modifiedTime!==drv.remoteMod){drvSet('conflict');drvConflictModal(f)}
  else if(drv.dirty){drvBackup()}else drvSet('ok')
 }catch(e){drvSet(drv.dirty?'pending':'ok');if(drv.dirty)drvSet('pending','Toca la nube para reconectar con Google')}}
function drvConnect(){const el=document.getElementById('drvCid');const id=(el?el.value:drv.clientId||'').trim();
 if(!/\.apps\.googleusercontent\.com$/.test(id)){toast('El ID debe terminar en .apps.googleusercontent.com');return}
 drv.clientId=id;drvSave();drvToken(true).then(()=>{drvSet('pending');return drvFind(true)}).then(f=>{
  if(f&&f.modifiedTime!==drv.remoteMod){closeModal();drvConflictModal(f)}
  else{drvBackup({interactive:true,force:true}).then(()=>drvModal())}
 }).catch(e=>{toast('No se pudo conectar: '+e.message);drvSet('error',e.message)})}
function drvDisconnect(){if(!confirm('¿Desconectar Google Drive de este dispositivo? Los respaldos que ya están en Drive no se borran.'))return;
 try{if(drv.token&&window.google&&google.accounts&&google.accounts.oauth2)google.accounts.oauth2.revoke(drv.token,()=>{})}catch(e){}
 drv={auto:true,clientId:drv.clientId};drvSave();drvSet('off');drvModal()}
function drvToggleAuto(v){drv.auto=!!v;drvSave();if(drv.auto&&drv.dirty)drvMarkDirty();drvPanelRefresh()}
function drvPanelRefresh(){const el=document.getElementById('drvPanel');if(!el)return;
 const st=document.getElementById('drvStatus');if(st)st.innerHTML='<span class="drvDot drv-'+drvState+'"></span> '+esc(drvLabel())+(drvMsg?' · '+esc(drvMsg):'');
 const lb=document.getElementById('drvLast');if(lb)lb.textContent=drvWhen(drv.lastBackupAt)}
function drvModal(){
 const origin=location.origin&&location.origin!=='null'?location.origin:'https://TU-USUARIO.github.io';
 const warn=location.protocol==='file:'?'<div class="errorBox" style="margin-bottom:10px">Abre la app desde HTTPS (por ejemplo GitHub Pages): Google no funciona desde un archivo local.</div>':'';
 let body;
 if(!drv.connected){
  body=warn+'<p class="muted">Guarda una copia de tus datos en <b>tu</b> Google Drive, automáticamente después de cada cambio. La app solo ve el archivo que ella misma crea, nunca el resto de tu Drive.</p>'+
  '<details class="drvHow" open><summary>Cómo obtener el ID de cliente (una sola vez, ~10 min)</summary><ol>'+
  '<li>Entra a <b>console.cloud.google.com</b> con tu cuenta y crea un proyecto (ej. "Tesorería").</li>'+
  '<li><b>APIs y servicios → Biblioteca</b>: busca <b>Google Drive API</b> y pulsa Habilitar.</li>'+
  '<li><b>Pantalla de consentimiento OAuth</b>: tipo Externo, nombre "Tesorería Pro", tu correo. En Permisos agrega <code>.../auth/drive.file</code>. Luego pulsa <b>Publicar aplicación</b> (así no pide volver a entrar cada semana).</li>'+
  '<li><b>Credenciales → Crear credenciales → ID de cliente de OAuth → Aplicación web</b>. En <b>Orígenes autorizados de JavaScript</b> agrega: <code>'+esc(origin)+'</code></li>'+
  '<li>Copia el ID (termina en <code>.apps.googleusercontent.com</code>) y pégalo aquí:</li></ol></details>'+
  '<input class="search" id="drvCid" placeholder="123456789-abc.apps.googleusercontent.com" value="'+esc(drv.clientId||'')+'" style="margin:10px 0"><div class="drvBtns"><button class="btn primary" onclick="drvConnect()">Conectar con Google</button><button class="btn" onclick="closeModal()">Cerrar</button></div>';
 }else{
  body='<div class="detailGrid" style="grid-template-columns:1fr 1fr"><div class="detail"><b>Estado</b><span id="drvStatus"></span></div><div class="detail"><b>Último respaldo</b><span id="drvLast"></span></div></div>'+
  '<label class="drvAuto"><input type="checkbox" '+(drv.auto?'checked':'')+' onchange="drvToggleAuto(this.checked)"> Respaldar automáticamente después de cada cambio</label>'+
  '<p class="muted" style="font-size:12px">Funciona mientras la app está abierta. Si Google pide volver a autorizar, toca la nube del encabezado. Para usar en otro dispositivo, conéctalo con el mismo ID de cliente y elige "Usar la de Drive".</p>'+
  '<div class="drvBtns"><button class="btn primary" onclick="drvBackup({interactive:true})">Respaldar ahora</button><button class="btn" onclick="drvRestoreNow()">Restaurar desde Drive</button><button class="btn danger" onclick="drvDisconnect()">Desconectar</button><button class="btn" onclick="closeModal()">Cerrar</button></div>';
 }
 $('dialog').innerHTML='<div class="moreSheet" id="drvPanel"><h3>Respaldo en Google Drive</h3>'+body+'</div>';openModal();drvPanelRefresh()}
function drvMountButton(){const t=document.querySelector('.top .tools');if(!t||document.getElementById('drvBtn'))return;
 const b=document.createElement('button');b.id='drvBtn';b.className='btn iconOnlyBtn drvBtn drv-'+drvState;b.setAttribute('aria-label','Respaldo en Google Drive');b.onclick=drvModal;
 b.innerHTML=actionIcon('cloud')+'<i class="drvDot drv-'+drvState+'"></i>';
 t.insertBefore(b,t.firstChild);drvSet(drv.connected?(drv.dirty?'pending':'ok'):'off')}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&drv.connected&&drv.dirty&&drv.auto&&drvReady)drvBackup()});
window.addEventListener('online',()=>{if(drv.connected&&drv.dirty&&drv.auto&&drvReady)drvBackup()});
setInterval(()=>{if(drv.connected&&drv.dirty&&drv.auto&&drvReady&&!drvBusy&&drvState==='pending'&&document.visibilityState==='visible')drvBackup()},120000);


/* ===== Avisos de respaldo y almacenamiento persistente ===== */
const BK_DAYS=7;
function bkLast(){let t=0,real=true;try{t=Number(localStorage.getItem('tesoreria-bk-last'))||0}catch(e){}
 try{t=Math.max(t,Date.parse(drv.lastBackupAt||'')||0)}catch(e){}
 if(!t){real=false;try{let f=Number(localStorage.getItem('tesoreria-bk-first'))||0;if(!f){f=Date.now();localStorage.setItem('tesoreria-bk-first',String(f))}t=f}catch(e){t=Date.now()}}
 return {t,real}}
function bkCheck(){try{
 const old=document.getElementById('bkBanner');const {t,real}=bkLast();const days=Math.floor((Date.now()-t)/86400000);
 if(days<BK_DAYS){if(old)old.remove();return}
 try{if(sessionStorage.getItem('bk-dismiss')===new Date().toDateString())return}catch(e){}
 if(old)return;
 const d=document.createElement('div');d.id='bkBanner';d.className='bkBanner';d.setAttribute('role','status');
 d.innerHTML='<span>'+(real?'Último respaldo hace '+days+' días.':'Aún sin respaldo ('+days+' días de uso).')+' Respalda para no perder tus datos.</span><button type="button" class="bkGo">Respaldar ahora</button><button type="button" class="bkX" aria-label="Cerrar aviso">✕</button>';
 d.querySelector('.bkGo').onclick=()=>{d.remove();bkNow()};
 d.querySelector('.bkX').onclick=()=>{try{sessionStorage.setItem('bk-dismiss',new Date().toDateString())}catch(e){}d.remove()};
 document.body.appendChild(d)}catch(e){console.warn(e)}}
function bkNow(){try{if(drv.connected)return drvBackup({interactive:true});exportJSON();}catch(e){console.warn(e)}}
async function bkPersist(){try{if(navigator.storage&&navigator.storage.persist){window.__stPersist=(await navigator.storage.persisted())||(await navigator.storage.persist())}}catch(e){}}
function bkStorageText(){return window.__stPersist===true?'sí':window.__stPersist===false?'no (instala la app en la pantalla de inicio para activarlo)':'no disponible en este navegador'}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')bkCheck()});
setInterval(bkCheck,3600000);
bkPersist();
applyTheme();load().then(()=>render()).catch(()=>render()).finally(()=>{drvMountButton();drvReady=true;drvCheckRemote();bkCheck()});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
window.addEventListener('error',e=>{if(/IndexedDB/i.test(e.message||'')){console.warn('IndexedDB no disponible; revisión en modo memoria.');}});</script></body></html>
