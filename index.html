<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#30444c">
  <meta name="description" content="Tesorería multiorganizacional local, privada y sin datos precargados.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>Tesorería</title>
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-mark">₲</div>
    <h1>Cargando Tesorería</h1>
    <p id="bootText">Preparando la base de datos local…</p>
    <div class="boot-actions">
      <button id="bootRetry" class="btn primary" hidden>Reintentar</button>
      <button id="bootReset" class="btn danger" hidden>Borrar base local y comenzar de cero</button>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <button class="brand" data-view="dashboard" aria-label="Panel principal">
        <span class="brand-mark">₲</span>
        <span><b>Tesorería</b><small>Multiorganizacional</small></span>
      </button>
      <div class="top-actions">
        <select id="orgSelect" class="org-select" aria-label="Organización activa"></select>
        <button id="roleBtn" class="icon-btn" title="Rol actual">Administrador</button>
        <button id="themeBtn" class="icon-btn" title="Cambiar tema">☼</button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <nav>
        <button data-view="dashboard" class="nav-item active"><span>⌂</span> Panel</button>
        <button data-view="organizations" class="nav-item"><span>▦</span> Organizaciones</button>
        <button data-view="members" class="nav-item"><span>♙</span> Integrantes</button>
        <button data-view="income" class="nav-item"><span>↗</span> Ingresos</button>
        <button data-view="expenses" class="nav-item"><span>↘</span> Egresos</button>
        <button data-view="boxes" class="nav-item"><span>▣</span> Cajas</button>
        <button data-view="reports" class="nav-item"><span>▤</span> Informes</button>
        <button data-view="backups" class="nav-item"><span>↥</span> Respaldos</button>
        <button data-view="audit" class="nav-item"><span>◌</span> Auditoría</button>
        <button data-view="settings" class="nav-item"><span>⚙</span> Configuración</button>
      </nav>
      <div class="sidebar-foot">
        <button id="wipeBtn" class="danger-link">Borrar toda la suite</button>
      </div>
    </aside>

    <main id="main" class="main"></main>

    <nav class="bottom-nav">
      <button data-view="dashboard"><span>⌂</span><small>Panel</small></button>
      <button data-view="organizations"><span>▦</span><small>Organizaciones</small></button>
      <button data-view="income"><span>↗</span><small>Ingresos</small></button>
      <button data-view="expenses"><span>↘</span><small>Egresos</small></button>
      <button data-view="settings"><span>⚙</span><small>Más</small></button>
    </nav>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true">
      <div id="modalContent"></div>
    </section>
  </div>

  <div id="toast" class="toast"></div>
  <input id="jsonInput" type="file" accept=".json,application/json" hidden>

  <script src="./app.js"></script>
</body>
</html>
