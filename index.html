function calc(){
  const inc=moves().filter(m=>['Aporte','Ingreso'].includes(m.type)).reduce((a,m)=>a+Number(m.amount||0),0);
  const exp=moves().filter(m=>m.type==='Egreso'||m.type==='Reembolso').reduce((a,m)=>a+Number(m.amount||0),0);
  const real=moves().filter(m=>m.fund==='Tesorería').reduce((a,m)=>a+(['Egreso','Reembolso'].includes(m.type)?-1:1)*Number(m.amount||0),0);
  const pres=moves().filter(m=>m.fund==='Presidenta').reduce((a,m)=>a+(['Egreso','Reembolso'].includes(m.type)?-1:1)*Number(m.amount||0),0);
  return {inc,exp,committed:inc-exp,real,pres,totalFunds:real+pres};
}

function reportRows(mode){
 const nums=configuredMonths(), names=nums.map(n=>MONTH_NAMES[n-1]);
 if(['income','expense','refund'].includes(mode)){
  const types=mode==='income'?['Ingreso','Aporte']:mode==='expense'?['Egreso']:['Reembolso'];
  return moves().filter(m=>types.includes(m.type)).sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(m=>[m.date||'',m.type||'',m.concept||'',m.person||'',m.rut||findPerson(m.person)?.rut||'',m.fund||'',money(m.amount),m.receiptId||'']);
 }
 return people().map(p=>{
  const monthlyTotal=nums.reduce((a,n)=>a+Number(monthlyRecord(p,n)?.amount||0),0);
  const extras=personContribsAllOrgs(p).filter(c=>String(c.contributionType||'').toLowerCase()==='extraordinaria');
  const extraTotal=extras.reduce((a,c)=>a+Number(c.amount||0),0);
  if(mode==='monthly')return [p.name,p.rut||'',...nums.map(n=>{const c=monthlyRecord(p,n);return c&&Number(c.amount||0)>0?money(c.amount):''}),money(monthlyTotal)];
  if(mode==='extra')return [p.name,p.rut||'',extras.map(c=>`${c.date||''} · ${c.concept||''} · ${money(c.amount)}`).join(' | '),money(extraTotal)];
  return [p.name,p.rut||'',...nums.map(n=>{const c=monthlyRecord(p,n);return c&&Number(c.amount||0)>0?money(c.amount):''}),money(monthlyTotal),money(extraTotal),money(monthlyTotal+extraTotal)];
 });
}

function reportPreview(mode){

 }else if(['income','expense','refund'].includes(mode)){

 }
 return `<div class="sheetHint">Solo se muestran montos efectivamente registrados. No se muestran estados como pendiente, deuda o morosidad.</div><div class="spreadsheet reportTableWrap masterSheet"><table><thead><tr>${headers.map((h,i)=>`<th class="${i<2?'sticky':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i<2?'sticky':''}">${esc(v||'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length}" class="empty">No hay datos.</td></tr>`}<tr class="totalRow"><th class="sticky">TOTALES</th><th class="sticky"></th>${mode==='income'||mode==='expense'||mode==='refund'?'<th></th><th></th><th></th><th></th><th></th><th>'+money(rows.reduce((s,r)=>s+(Number(String(r[6]||'').replace(/[^\\d]/g,''))||0),0))+'</th><th></th>':mode==='extra'?'<th></th><th></th><th>'+money(rows.reduce((s,r)=>s+(Number(String(r[3]||'').replace(/[^\\d]/g,''))||0),0))+'</th>':headers.slice(2).map((_,i)=>`<th>${money(rows.reduce((s,r)=>s+(Number(String(r[i+2]||'').replace(/[^\\d]/g,''))||0),0))}</th>`).join('')}</tr></tbody></table></div>`;
}

function quickMonthlyPayment(pid,n){
  const p=people().find(x=>x.id===pid);if(!p)return;
  let c=monthlyRecord(p,n);
  const cfg=(data.quotaConfigs||[]).find(q=>q.type==='mensual'&&n>=Number(q.startMonth||1)&&n<=Number(q.endMonth||12));
  const defaultAmount=Number(c?.amount||cfg?.amount||0);
  const value=prompt(`Monto cancelado de ${MONTH_NAMES[n-1]} para ${p.name}:`,String(defaultAmount||3000));
  if(value===null)return;
  const amount=Number(String(value).replace(/[^0-9]/g,''));
  if(!amount||amount<0){alert('Ingresa un monto válido.');return}
  if(!confirmSave(`¿Confirmas registrar ${money(amount)} como ingreso de la cuota de ${MONTH_NAMES[n-1]}?`))return;
  const today=new Date().toISOString().slice(0,10), id=uid('M');
  const m={id,date:today,organization:data.organization['Nombre de la organización'],organizationId:data.organization.id,type:'Ingreso',contributionType:'Mensual',concept:`Cuota mensual ${MONTH_NAMES[n-1]}`,fund:'Tesorería',method:'Transferencia',amount,person:p.name,rut:p.rut||'',tutor:p.tutor||'',status:'Registrado',notes:'Pago generado desde la ficha del integrante',receiptId:receiptId('Ingreso')};
  data.movements.push(m);
  if(!c){c={id:uid('C'),person:p.name,month:n,year:YEAR,date:today,concept:m.concept,fund:'Tesorería',amount,contributionType:'Mensual',status:'AL DÍA',moveId:id,kind:'mensual',organizationId:data.organization.id};data.contributions.push(c)}
  else{c.amount=amount;c.date=today;c.status='AL DÍA';c.moveId=id;c.kind='mensual';c.contributionType='Mensual';c.organizationId ||= data.organization.id}
  persist();personDetail(pid);
}

function setMonthlyStatus(pid,n,status){
  const p=people().find(x=>x.id===pid);if(!p)return;
  let c=monthlyRecord(p,n);
  if(status==='AL DÍA'){
    if(c&&Number(c.amount)>0){c.status='AL DÍA';persist();personDetail(pid);return}
    const cfg=(data.quotaConfigs||[]).find(q=>q.type==='mensual'&&n>=Number(q.startMonth||1)&&n<=Number(q.endMonth||12));
    const amount=Number(c?.amount||cfg?.amount||0);
    if(!amount){alert('Configura primero el monto de la cuota o ingrésalo desde el valor.');personDetail(pid);return}
    quickMonthlyPayment(pid,n);return;
  }
  if(!c){if(!status)return;c={id:uid('C'),person:p.name,month:n,year:YEAR,date:'',concept:'',fund:'Tesorería',amount:0,contributionType:'Mensual',status,kind:'mensual',organizationId:data.organization.id};data.contributions.push(c)}
  else{
    if(c.status==='AL DÍA' && Number(c.amount)>0 && !confirmSave(`La cuota de ${MONTH_NAMES[n-1]} tiene un ingreso de ${money(c.amount)}. ¿Cambiar su situación a ${status} y conservar el movimiento?`)){personDetail(pid);return}
    c.status=status;
  }
  persist();personDetail(pid);
}

async function unzipEntries(buf){

   const raw=u.slice(dataStart,dataStart+csize);
   let bytes;
   if(method===0) bytes=raw;
   else if(method===8){
     if(!('DecompressionStream' in window))throw new Error('Este navegador no admite descompresión XLSX. Usa JSON o CSV.');
     const ds=new DecompressionStream('deflate-raw');bytes=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());

   if(usize && bytes.length!==usize){} // algunos libros usan tamaños no confiables
   out[name]=new TextDecoder('utf-8').decode(bytes);pos+=46+nlen+xlen+clen;

}

function wrapText(ctx,text,maxWidth){
 const words=String(text??'').split(/\s+/);const lines=[];let line='';
 for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width<=maxWidth)line=test;else{if(line)lines.push(line);line=word}}
 if(line)lines.push(line);return lines.length?lines:[''];
}

 const lines=wrapText(ctx,text,maxWidth).slice(0,maxLines);lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));return y+lines.length*lineHeight;
}

 const pages=[];people().forEach(p=>{pages.push(x=>{pageTitle(x,'Ficha de integrante',p.name);let y=400;x.font='700 16px Arial';x.fillStyle='#153a43';x.fillText(`RUT: ${p.rut||'—'} · Teléfono: ${p.phone||'—'} · Correo: ${p.email||'—'}`,90,y);y=drawCompactTable(x,['Mes','Monto','Situación'],configuredMonths().map(n=>{const c=monthlyRecord(p,n);return [MONTH_NAMES[n-1],c&&Number(c.amount)>0?money(c.amount):'',''] }),y+25,[520,400,500],27)+10;const ex=personContribsAllOrgs(p).filter(c=>String(c.contributionType||'').toLowerCase()==='extraordinaria');const rr=(data.reimbursements||[]).filter(r=>r.person===p.name);y=drawCompactTable(x,['Extraordinaria','Concepto','Monto'],ex.slice(0,5).map(c=>[c.date||'',c.concept||'',money(c.amount)]),y,[300,900,220],26)+10;drawCompactTable(x,['Reembolso','Concepto','Monto'],rr.slice(0,4).map(r=>[r.date||'',r.concept||'',money(r.amount)]),y,[300,900,220],26);});});pdfCanvasPages('Tesorería · Fichas',pages,`Fichas_Integrantes_${YEAR}.pdf`);
}
function pdfBox(name){const ms=moves().filter(m=>m.fund===name).sort((a,b)=>String(a.date).localeCompare(String(b.date)));const rows=ms.map(m=>[m.date,m.type,m.concept||'',m.person||'',money(m.amount),m.receiptId||'']);const pages=[];for(let i=0;i<rows.length||i===0;i+=12){const part=rows.slice(i,i+12);pages.push(x=>{pageTitle(x,'Detalle de caja',name);drawTable(x,['Fecha','Tipo','Concepto','Integrante','Monto','Comprobante'],part,420,[210,180,480,260,150,180])})}pdfCanvasPages('Tesorería · Caja',pages,`Caja_${name.replace(/\W+/g,'_')}_${YEAR}.pdf`)}
function pdfBoxes(){const names=[...new Set(['Tesorería','Presidenta',...(data.accounts||[]).map(a=>a.name).filter(Boolean)])];const pages=[];for(const n of names){const rows=moves().filter(m=>m.fund===n).map(m=>[m.date,m.type,m.concept||'',m.person||'',money(m.amount)]);for(let i=0;i<rows.length||i===0;i+=12){const part=rows.slice(i,i+12);pages.push(x=>{pageTitle(x,'Detalle de caja',n);drawTable(x,['Fecha','Tipo','Concepto','Integrante','Monto'],part,420,[220,180,560,280,180])})}}pdfCanvasPages('Tesorería · Cajas',pages,`Informe_Cajas_${YEAR}.pdf`)}


function receiptPDF(id){
 const m=moves().find(x=>x.id===id);if(!m)return;const p=findPerson(m.person);
 pdfCanvasPages('Comprobante automático',[x=>{pageTitle(x,'Comprobante de movimiento',m.receiptId||'');let y=420;
 const lines=[['Número',m.receiptId||''],['Fecha',m.date||''],['Tipo',m.type||''],['Concepto',m.concept||''],['Integrante',m.person||''],['RUT',m.rut||p?.rut||''],['Caja / fondo',m.fund||''],['Método',m.method||''],['Monto',money(m.amount)]];
 lines.forEach(([a,b])=>{x.fillStyle='#f2f6f5';x.fillRect(100,y,1400,58);x.fillStyle='#617378';x.font='700 16px Arial';x.fillText(a,125,y+36);x.fillStyle='#153a43';x.font='800 18px Arial';drawWrapped(x,String(b),470,y+21,980,20,2);y+=70});
 y+=12;x.fillStyle='#edf5f3';x.fillRect(100,y,1400,150);x.fillStyle='#153a43';x.font='700 14px Arial';drawWrapped(x,orgPaymentLines().join('   ·   '),120,y+25,1360,19,5);
 }],`${m.receiptId||'Comprobante'}.pdf`);
}

function shareReceipt(id){
 const m=moves().find(x=>x.id===id);if(!m)return;
 const text=`Comprobante ${m.receiptId||''} · ${m.type} · ${money(m.amount)} · ${m.concept||''}`;
 if(navigator.share){navigator.share({title:m.receiptId||'Comprobante',text}).catch(()=>{})}
 else {const choice=confirm('Aceptar = WhatsApp. Cancelar = correo.');if(choice)location.href='https://wa.me/?text='+encodeURIComponent(text);else location.href='mailto:?subject='+encodeURIComponent(m.receiptId||'Comprobante')+'&body='+encodeURIComponent(text)}
}
