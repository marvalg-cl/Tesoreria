let idbPromise=null;
function openIDB(){
 if(!('indexedDB' in window)) return Promise.reject(new Error('IndexedDB no disponible'));

  const req=indexedDB.open(IDB_NAME,3);

function ensureMonthlyReceipt(c){

function configuredMonths(){
  const cfg=(data.quotaConfigs||[]).filter(q=>q.active!==false && Number(q.year||YEAR)===YEAR && ['mensual','obligatoria'].includes(String(q.type||'').toLowerCase()));
  const set=new Set(); cfg.forEach(q=>{for(let n=Number(q.startMonth||1);n<=Number(q.endMonth||12);n++)set.add(n)});
  if(!set.size) for(let n=3;n<=12;n++)set.add(n);
  return [...set].sort((a,b)=>a-b);
}

function calc(){
  const active=moves().filter(m=>!['Revertido','Anulado'].includes(String(m.status||'')));
  const inc=active.filter(m=>['Aporte','Ingreso'].includes(m.type)).reduce((a,m)=>a+Number(m.amount||0),0);
  const exp=active.filter(m=>m.type==='Egreso'||m.type==='Reembolso').reduce((a,m)=>a+Number(m.amount||0),0);
  const real=active.filter(m=>m.fund==='Tesorería').reduce((a,m)=>a+(['Egreso','Reembolso'].includes(m.type)?-1:1)*Number(m.amount||0),0);
  const pres=active.filter(m=>m.fund==='Presidenta').reduce((a,m)=>a+(['Egreso','Reembolso'].includes(m.type)?-1:1)*Number(m.amount||0),0);
  return {inc,exp,committed:inc-exp,real,pres,totalFunds:real+pres};
}
function formatRut(value){
  let v=String(value||'').toUpperCase().replace(/[^0-9K]/g,'');
  if(!v)return '';
  if(v.length<8)return v;
  const dv=v.slice(-1); let body=v.slice(0,-1);
  let out=''; while(body.length>3){out='.'+body.slice(-3)+out;body=body.slice(0,-3)} out=body+out;
  return out+'-'+dv;
}

function copyToClipboard(text,label){
 if(!text)return;
 const done=()=>toast(`${label||'Dato'} copiado`);
 if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done))}
 else fallbackCopy(text,done);
}
function fallbackCopy(text,cb){
 const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();
 try{document.execCommand('copy')}catch(e){}
 document.body.removeChild(ta); if(cb)cb();
}

function allContacts(){
 const list=[];
 allPeople().forEach(p=>{
  list.push({id:'P:'+p.id,personId:p.id,kind:'Integrante',name:p.name,rut:p.rut,phone:p.phone,mobile:p.mobile,whatsapp:p.whatsapp,telegram:p.telegram,email:p.email,address:p.address,commune:p.commune,orgs:personOrgNames(p),related:''});
 });
 const tutorMap=new Map();
 people().forEach(p=>{
  if(!p.tutor)return;
  const key=p.tutor.trim().toUpperCase();
  if(!tutorMap.has(key))tutorMap.set(key,{id:'T:'+key,personId:null,kind:'Tutor / Apoderado',name:p.tutor.trim(),rut:p.tutorRut,phone:p.tutorPhone,mobile:p.tutorMobile,whatsapp:p.tutorWhatsapp,telegram:p.tutorTelegram,email:p.tutorEmail,address:p.tutorAddress,commune:p.tutorCommune,orgs:new Set(),related:[]});
  const t=tutorMap.get(key);
  t.related.push(p.name);
  personOrgNames(p).forEach(o=>t.orgs.add(o));
 });
 tutorMap.forEach(t=>{t.orgs=[...t.orgs];t.related=t.related.join(', ');list.push(t)});
 return list;
}
function contactVCard(c){
 const lines=['BEGIN:VCARD','VERSION:3.0',`FN:${c.name}`,`N:${c.name};;;;`];
 if(c.kind)lines.push(`TITLE:${c.kind}${c.related?' de '+c.related:''}`);
 if(c.mobile)lines.push(`TEL;TYPE=CELL:${c.mobile}`);
 if(c.phone)lines.push(`TEL;TYPE=HOME:${c.phone}`);
 if(c.whatsapp)lines.push(`TEL;TYPE=WORK:${c.whatsapp}`);
 if(c.email)lines.push(`EMAIL:${c.email}`);
 if(c.address||c.commune)lines.push(`ADR;TYPE=HOME:;;${c.address||''};${c.commune||''};;;Chile`);
 if(c.orgs?.length)lines.push(`ORG:${c.orgs.join(' / ')}`);
 if(c.rut)lines.push(`NOTE:RUT ${c.rut}`);
 lines.push('END:VCARD');
 return lines.join('\r\n');
}
function exportContactVCard(id){

}
function exportAllContactsVCF(){

const FIXED_CONTRIBUTION_TYPES=['anual','semestral','trimestral','fija','otra fija'];
function contributionTypeKey(c){return String(c?.contributionType||c?.kind||'').trim().toLowerCase();}
function isMonthlyContribution(c){
  const t=contributionTypeKey(c);
  if(t==='extraordinaria') return false;
  if(t==='mensual'||t==='obligatoria'||String(c?.kind||'').toLowerCase()==='mensual') return true;
  const n=Number(c?.month||c?.mes||0);
  if(n>=1&&n<=12){
    const concept=String(c?.concept||'').trim().toLowerCase();
    const monthName=MONTH_NAMES[n-1]?.toLowerCase()||'';
    if(concept===monthName || concept===`cuota ${monthName}` || concept.includes(`cuota mensual ${monthName}`)) return true;
  }
  return false;
}
function isFixedContribution(c){
  const t=contributionTypeKey(c);
  return !isMonthlyContribution(c) && FIXED_CONTRIBUTION_TYPES.includes(t) && t!=='extraordinaria';
}
function monthlyRecord(p,n){
  return personContribsAllOrgs(p).filter(c=>Number(c.month||c.mes||0)===n && isMonthlyContribution(c))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')))[0];
}

 return `<div class="sheetHint">Planilla completa en formato horizontal. Las celdas sin movimiento quedan en blanco. Los totales forman parte de la propia planilla y no se repiten en tarjetas externas.</div><div class="spreadsheet reportTableWrap masterSheet"><table><thead><tr>${headers.map((h,i)=>`<th class="${i<2?'sticky':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i<2?'sticky':''}">${esc(v||'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${headers.length}" class="empty">No hay datos.</td></tr>`}<tr class="totalRow"><th class="sticky">TOTALES</th><th class="sticky"></th>${totals.map((v,i)=>`<th>${v==='$0'?'':v}</th>`).join('')}</tr></tbody></table></div>`;
}

function ensureContributionReceipt(c){
  if(!c || Number(c.amount||0)<=0 || ['PENDIENTE','EXIMIDO','NO PARTICIPA','NO APLICA','ANULADO','REVERSA','CANCELADO'].includes(String(c.status||''))) return false;

  const p=findPerson(c.person); if(!p)return false;
  const isExtra=String(c.contributionType||'').toLowerCase()==='extraordinaria';
  const type=isExtra?'Aporte':'Ingreso';
  let m=moves().find(m=>m.person===c.person && Number(m.amount||0)===Number(c.amount||0) && String(m.concept||'').toLowerCase()===String(c.concept||'').toLowerCase() && String(m.date||'')===String(c.date||''));

  c.moveId=m.id;c.receiptId=m.receiptId||receiptId(type);return true;
}

function setContributionStatus(cid,mid,status){
  const c=(data.contributions||[]).find(x=>x.id===cid);
  if(c)c.status=status;
  if(mid){
    const m=moves().find(x=>x.id===mid);
    if(m){
      if(status==='REVERSA')m.status='Revertido';
      else if(status==='ANULADO')m.status='Anulado';
      else if(status==='AL DÍA' && ['Revertido','Anulado'].includes(m.status))m.status='Registrado';
      m.modifiedAt=new Date().toISOString();m.modifiedBy='Usuario local';
    }
  }
  persist();
  const personName=c?.person || (mid?moves().find(x=>x.id===mid)?.person:'');
  const p=people().find(x=>x.name===personName);
  if(p)personDetail(p.id);else render();
}
function quickMonthlyPayment(pid,n){
  const p=people().find(x=>x.id===pid);if(!p)return;
  let c=monthlyRecord(p,n);
  const cfg=(data.quotaConfigs||[]).find(q=>q.type==='mensual'&&n>=Number(q.startMonth||1)&&n<=Number(q.endMonth||12));
  const defaultAmount=Number(c?.amount||cfg?.amount||0);
  const value=prompt(`Monto cancelado de ${MONTH_NAMES[n-1]} para ${p.name}:`,String(defaultAmount||3000));
  if(value===null)return;
  const amount=Number(String(value).replace(/[^0-9]/g,''));
  if(!amount||amount<0){alert('Ingresa un monto válido.');return}
  if(!confirmSave(`¿Confirmas registrar ${money(amount)} como ingreso de la cuota de ${MONTH_NAMES[n-1]}?`))return;
  const today=new Date().toISOString().slice(0,10), id=uid('M');
  const m={id,date:today,organization:data.organization['Nombre de la organización'],organizationId:data.organization.id,type:'Ingreso',contributionType:'Mensual',concept:`Cuota mensual ${MONTH_NAMES[n-1]}`,fund:'Tesorería',method:'Transferencia',amount,person:p.name,rut:p.rut||'',tutor:p.tutor||'',status:'Registrado',notes:'Pago generado desde la ficha del integrante',receiptId:receiptId('Ingreso')};
  data.movements.push(m);
  if(!c){c={id:uid('C'),person:p.name,month:n,year:YEAR,date:today,concept:m.concept,fund:'Tesorería',amount,contributionType:'Mensual',status:'AL DÍA',moveId:id,kind:'mensual',organizationId:data.organization.id};data.contributions.push(c)}
  else{c.amount=amount;c.date=today;c.status='AL DÍA';c.moveId=id;c.kind='mensual';c.contributionType='Mensual';c.organizationId ||= data.organization.id}
  ensureMonthlyReceipt(c);
  persist();personDetail(pid);
}

function setMonthlyStatus(pid,n,status){
  const p=people().find(x=>x.id===pid);if(!p)return;
  let c=monthlyRecord(p,n);
  if(status==='AL DÍA'){
    if(c&&Number(c.amount)>0){c.status='AL DÍA';ensureMonthlyReceipt(c);persist();personDetail(pid);return}
    const cfg=(data.quotaConfigs||[]).find(q=>q.type==='mensual'&&n>=Number(q.startMonth||1)&&n<=Number(q.endMonth||12));
    const amount=Number(c?.amount||cfg?.amount||0);
    if(!amount){alert('Configura primero el monto de la cuota o ingrésalo desde el valor.');personDetail(pid);return}
    quickMonthlyPayment(pid,n);return;
  }
  if(!c){c={id:uid('C'),person:p.name,month:n,year:YEAR,date:'',concept:'',fund:'Tesorería',amount:0,contributionType:'Mensual',status,kind:'mensual',organizationId:data.organization.id};data.contributions.push(c)}
  else c.status=status;
  if(c.moveId){const m=moves().find(x=>x.id===c.moveId);if(m){if(['REVERSA','ANULADO','CANCELADO'].includes(status)){m.status=status==='REVERSA'?'Revertido':'Anulado';m.reversalDate=new Date().toISOString().slice(0,10);m.reversalReason=status;}else if(['PENDIENTE','EXIMIDO','NO PARTICIPA','NO APLICA',''].includes(status)){m.status='Anulado';m.reversalDate=new Date().toISOString().slice(0,10);m.reversalReason='Estado de cuota: '+status;}}}
  persist();personDetail(pid);
}

async function savePersonEdit(e,id){

async function unzipEntries(buf){
 const u=new Uint8Array(buf), dv=new DataView(buf);
 let eocd=-1;
 for(let i=u.length-22;i>=Math.max(0,u.length-66000);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
 if(eocd<0)throw new Error('No se encontró una estructura XLSX válida.');
 const cdSize=dv.getUint32(eocd+12,true), cdOffset=dv.getUint32(eocd+16,true);let pos=cdOffset;const out={};

.cardhead{color:#fff;text-align:center;font-weight:900;font-size:9.5px;padding:6px}
.cardbody{display:flex}
.metric{flex:1;text-align:center;padding:8px 3px;border-right:1px solid #d7e0e7}
.metric:last-child{border-right:0}
.metric .lbl{font-size:7.8px;font-weight:800}
.metric .val{font-size:11px;font-weight:900;color:#17324d;margin-top:3px}
.section{border:1px solid #a9c2d7;border-radius:8px;margin-bottom:6px;overflow:hidden;page-break-inside:avoid}
.sectiontitle{background:#f3f7fb;padding:7px 12px;font-weight:900;color:#0b2f5b;font-size:11.5px;display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;font-size:8.8px}
th{background:#0b2f5b;color:#fff;font-weight:800;padding:5px 6px;font-size:8px;text-align:left}
td{padding:4px 6px;border-bottom:1px solid #dce6ee}
tr:nth-child(even) td{background:#f7fafc}
.totalrow td{font-weight:900;color:#0b2f5b;border-top:1.5px solid #a9c2d7;background:#eef4f8!important}
.contactgrid{display:flex;border:1px solid #a9c2d7;border-radius:8px;margin-bottom:6px;overflow:hidden;page-break-inside:avoid}
.contactcol{flex:1;padding:10px 14px;font-size:9.3px}
.contactcol+.contactcol{border-left:1px solid #d7e0e7}
.contactcol h3{margin:0 0 6px;color:#0b2f5b;font-size:11px}
.contactcol .row{padding:2px 0;border-bottom:1px dashed #e3ebf1}
.contactcol .row b{color:#5e7182;font-weight:800;font-size:8px;text-transform:uppercase;display:inline-block;min-width:70px}
.footerinfo{display:flex;gap:16px;border:1px solid #a9c2d7;border-radius:8px;padding:8px 12px;margin-bottom:4px;font-size:9.3px;page-break-inside:avoid}
.footerinfo>div{flex:1}
.footerinfo b.h{color:#0b2f5b;display:block;margin-bottom:5px;font-size:10px}
.pagefooter{text-align:center;color:#5e7182;font-size:8.3px;margin-top:4px;border-top:1px solid #e3ebf1;padding-top:4px;page-break-inside:avoid}
@media print{.noprint{display:none}}
