<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5d6368">
<link rel="manifest" href="./manifest.webmanifest">
<title>Tesorería Multiorganizacional</title>
<style>
:root{--orange:#e87924;--gray:#5d6368;--bg:#f3f4f5;--card:#fff;--text:#263238;--muted:#6b7378;--line:#dfe3e6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--gray);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:10}
header h1{font-size:20px;margin:0}header p{margin:4px 0 0;font-size:12px;opacity:.85}
main{max-width:1100px;margin:auto;padding:16px 16px 92px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0000000b}
.empty{text-align:center;padding:48px 20px}.empty .mark{font-size:42px;margin-bottom:8px}.empty h2{margin:6px 0}.empty p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
button,.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;background:var(--orange);color:#fff}
button.secondary,.btn.secondary{background:#eef0f1;color:var(--text);border:1px solid var(--line)}
button.danger{background:#b83232}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:20;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}
nav button{background:transparent;color:var(--gray);padding:7px 5px;min-width:58px;font-size:11px}
nav button span{display:block;font-size:19px;line-height:20px;margin-bottom:2px}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font:inherit}
.hidden{display:none!important}.toast{position:fixed;left:16px;right:16px;bottom:76px;background:#263238;color:#fff;padding:12px 14px;border-radius:12px;z-index:50;text-align:center}
small{color:var(--muted)}
@media(max-width:620px){main{padding:12px 12px 92px}.grid{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{width:100%;padding:11px 8px}.card{padding:14px}header h1{font-size:18px}}
</style>
</head>
<body>
<header><h1>💰 Tesorería Multiorganizacional</h1><p id="orgLine">Suite limpia · sin datos precargados</p></header>
<main id="app"></main>
<nav>
<button data-view="home"><span>⌂</span>Inicio</button>
<button data-view="people"><span>👥</span>Integrantes</button>
<button data-view="moves"><span>↕</span>Movimientos</button>
<button data-view="reports"><span>▤</span>Informes</button>
<button data-view="more"><span>☰</span>Más</button>
</nav>
<input id="jsonFile" type="file" accept=".json,application/json" class="hidden">
<input id="excelFile" type="file" accept=".xlsx,.xls" class="hidden">
<script>
const DB_NAME='tesoreria_multiorganizacional_clean_v1', DB_VER=1;
let db, state={view:'home',org:null};

function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,DB_VER);r.onupgradeneeded=e=>{let d=e.target.result;['organizations','people','movements','contributions','accounts','settings','attachments'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})});};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=()=>rej(r.error)})}
function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}
function all(store){return new Promise((res,rej)=>{let r=tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{let r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function clearAll(){return Promise.all(['organizations','people','movements','contributions','accounts','settings','attachments'].map(s=>new Promise((res,rej)=>{let r=tx(s,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})))}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(t){let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),2200)}
async function refreshOrg(){let o=await all('organizations');state.org=o[0]||null;document.querySelector('#orgLine').textContent=state.org?`${state.org.name} · ${state.org.type||'Organización'}`:'Suite limpia · sin datos precargados'}
function render(){
 const a=document.querySelector('#app');
 if(state.view==='home') return home(a);
 if(state.view==='people') return people(a);
 if(state.view==='moves') return moves(a);
 if(state.view==='reports') return reports(a);
 if(state.view==='more') return more(a);
}
function home(a){
 if(!state.org){a.innerHTML=`<section class="card empty"><div class="mark">💰</div><h2>Tu Suite está lista</h2><p>No hay organizaciones registradas. Los datos se incorporan únicamente mediante tus formularios o importación.</p><div class="actions"><button onclick="newOrg()">＋ Nueva organización</button><button class="secondary" onclick="document.querySelector('#jsonFile').click()">⇧ Importar JSON</button></div><p><small>Esta versión parte completamente vacía.</small></p></section>`;return}
 a.innerHTML=`<section class="card"><h2>${esc(state.org.name)}</h2><p>${esc(state.org.type||'')} ${state.org.year?'· '+esc(state.org.year):''}</p><div class="actions"><button onclick="newPerson()">＋ Integrante</button><button onclick="newMove()">＋ Movimiento</button><button class="secondary" onclick="view='reports';state.view='reports';render()">▤ Informes</button></div></section>`;
}
function newOrg(){let name=prompt('Nombre de la organización');if(!name)return;let type=prompt('Tipo (curso, colegio, club deportivo, junta de vecinos, iglesia, organización social, otro)','Curso')||'Curso';let year=prompt('Año','2026')||'';let o={id:crypto.randomUUID(),name,type,year,createdAt:new Date().toISOString()};put('organizations',o).then(()=>{state.org=o;toast('Organización creada');render();refreshOrg()})}
function people(a){if(!state.org){return home(a)}all('people').then(ps=>{ps.sort((x,y)=>(x.name||'').localeCompare(y.name||'','es'));a.innerHTML=`<section class="card"><h2>Integrantes</h2><div class="actions"><button onclick="newPerson()">＋ Nuevo integrante</button></div></section><section class="card">${ps.length?ps.map(p=>`<button class="secondary" style="display:block;width:100%;margin:7px 0;text-align:left" onclick="personDetail('${p.id}')">${esc(p.name)}<br><small>${esc(p.role||'')}${p.rut?' · '+esc(p.rut):''}</small></button>`).join(''):'<p>No hay integrantes.</p>'}</section>`})}
function newPerson(){let name=prompt('Nombre completo');if(!name)return;let rut=prompt('RUT (opcional)')||'';let role=prompt('Rol (alumno, socio, jugador, etc.)')||'';put('people',{id:crypto.randomUUID(),orgId:state.org.id,name,rut,role}).then(()=>{toast('Integrante guardado');render()})}
function personDetail(id){all('people').then(ps=>{let p=ps.find(x=>x.id===id);if(!p)return;document.querySelector('#app').innerHTML=`<section class="card"><h2>${esc(p.name)}</h2><p><b>RUT:</b> ${esc(p.rut)}</p><p><b>Rol:</b> ${esc(p.role)}</p><p><b>Organización:</b> ${esc(state.org.name)}</p><button class="secondary" onclick="state.view='people';render()">← Volver</button></section>`})}
function moves(a){if(!state.org)return home(a);all('movements').then(ms=>{ms=ms.filter(m=>m.orgId===state.org.id);a.innerHTML=`<section class="card"><h2>Movimientos</h2><div class="actions"><button onclick="newMove()">＋ Nuevo movimiento</button></div></section><section class="card">${ms.length?ms.map(m=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${esc(m.kind)}</b> · ${esc(m.detail||'')}<br><small>${esc(m.date||'')} · $${Number(m.amount||0).toLocaleString('es-CL')} · ${esc(m.method||'')}</small></div>`).join(''):'<p>No hay movimientos.</p>'}</section>`})}
function newMove(){if(!state.org)return;let kind=prompt('Tipo: Ingreso o Egreso','Ingreso');if(!kind)return;let detail=prompt('Concepto');if(!detail)return;let amount=Number((prompt('Monto','0')||'0').replace(/\\D/g,''));let method=prompt('Medio: Efectivo, Transferencia, Depósito, Otro','Efectivo')||'Efectivo';put('movements',{id:crypto.randomUUID(),orgId:state.org.id,kind,detail,amount,date:new Date().toISOString().slice(0,10),method,status:'Pagado'}).then(()=>{toast('Movimiento guardado');render()})}
function reports(a){if(!state.org)return home(a);a.innerHTML=`<section class="card"><h2>Informes</h2><p>Los informes se generarán desde los datos de IndexedDB cuando existan registros.</p><div class="actions"><button onclick="report('general')">Informe general</button><button onclick="report('people')">Informe integrantes</button><button onclick="report('planilla')">Planilla GENERAL</button><button onclick="report('finance')">Informe financiero</button></div></section>`}
function report(kind){toast('Generación de informes preparada para la versión funcional completa.');}
function more(a){a.innerHTML=`<section class="card"><h2>Configuración y datos</h2><div class="grid"><div><label>Tesorero/a</label><input id="treasurer" placeholder="Nombre del tesorero/a"></div><div><label>RUT</label><input id="trut" placeholder="12.345.678-9"></div><div><label>Teléfono</label><input id="tphone" placeholder="+569"></div><div><label>Correo</label><input id="temail" type="email"></div></div><div class="actions" style="margin-top:14px"><button onclick="saveTreasurer()">Guardar tesorero/a</button><button class="secondary" onclick="accountForm()">＋ Cuenta bancaria</button><button class="secondary" onclick="document.querySelector('#jsonFile').click()">Importar JSON</button><button class="secondary" onclick="exportJSON()">Exportar JSON</button><button class="danger" onclick="wipe()">⚠ Borrar toda la Suite</button></div></section><section class="card"><h3>Estado</h3><p>IndexedDB: activo</p><p>Datos precargados: <b>ninguno</b></p></section>`}
function saveTreasurer(){let s={id:'treasurer',name:document.querySelector('#treasurer').value,rut:document.querySelector('#trut').value,phone:document.querySelector('#tphone').value,email:document.querySelector('#temail').value};put('settings',s).then(()=>toast('Datos del tesorero guardados'))}
function accountForm(){let bank=prompt('Banco (BancoEstado, Chile, Santander, BCI, Scotiabank, Itaú, Falabella, Ripley, Tenpo, Mercado Pago, MACH, Otro)','BancoEstado')||'';let type=prompt('Tipo (Cuenta RUT, Corriente, Vista, Ahorro, Digital, Otro)','Cuenta RUT')||'';let number=prompt('Número de cuenta')||'';if(!number)return;put('accounts',{id:crypto.randomUUID(),orgId:state.org?.id||null,bank,type,number}).then(()=>toast('Cuenta bancaria guardada'))}
async function exportJSON(){let data={format:'tesoreria-multiorganizacional',version:'1.0',exportedAt:new Date().toISOString(),organization:state.org,treasurer:(await all('settings')).find(x=>x.id==='treasurer')||null,accounts:await all('accounts'),people:await all('people'),contributions:await all('contributions'),movements:await all('movements'),attachments:await all('attachments')};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='respaldo-tesoreria.json';a.click();URL.revokeObjectURL(url);toast('Respaldo JSON creado')}
document.querySelector('#jsonFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.format!=='tesoreria-multiorganizacional')throw Error('Formato JSON no reconocido');await clearAll();if(data.organization)await put('organizations',data.organization);for(let p of (data.people||[]))await put('people',p);for(let c of (data.contributions||[]))await put('contributions',c);for(let m of (data.movements||[]))await put('movements',m);for(let x of (data.accounts||[]))await put('accounts',x);for(let x of (data.attachments||[]))await put('attachments',x);if(data.treasurer)await put('settings',data.treasurer);await refreshOrg();state.view='home';render();toast('JSON importado correctamente')}catch(err){toast('JSON inválido: '+err.message)}e.target.value=''});

async function wipe(){if(!confirm('Esto eliminará TODAS las organizaciones, integrantes, movimientos, cuotas, cuentas y respaldos locales. ¿Continuar?'))return;await clearAll();state.org=null;await refreshOrg();state.view='home';render();toast('Suite restablecida completamente')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});
openDB().then(()=>{refreshOrg().then(render)}).catch(e=>{document.querySelector('#app').innerHTML='<section class="card"><h2>Error de base local</h2><p>'+esc(e.message)+'</p></section>'});
</script>
</body>
</html>
