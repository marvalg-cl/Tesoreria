<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#31434b">
<meta name="description" content="Tesorería Multiorganizacional · gestión local con IndexedDB">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Tesorería Multiorganizacional</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="app" class="app-shell">
  <header class="topbar">
    <div class="brand-block">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h16M6 4h12v16H6z"/><path d="M8 10h8M8 14h5"/></svg></div>
      <div class="brand-copy"><strong>Tesorería</strong><span>Multiorganizacional</span></div>
    </div>
    <div class="org-context">
      <label for="orgSelect" class="sr-only">Organización activa</label>
      <select id="orgSelect" aria-label="Organización activa"><option value="">Sin organizaciones</option></select>
      <button id="refreshBtn" class="icon-button top-refresh" title="Actualizar" aria-label="Actualizar"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-4M4 5v5h5M4 13a8 8 0 0 0 14.9 4M20 19v-5h-5"/></svg></button>
    </div>
  </header>

  <main id="main" class="main-content"></main>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navegación principal">
    <button data-route="dashboard" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z"/><path d="M9 21v-7h6v7"/></svg><span>Inicio</span></button>
    <button data-route="people" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.4 2.7-6 6-6s6 2.6 6 6"/><circle cx="17.5" cy="9" r="2.2"/><path d="M15.5 14.5c2.8.4 4.8 2.5 5 5.5"/></svg><span>Personas</span></button>
    <button data-route="movements" class="nav-item"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/><path d="m17 15 3 3-3 3"/></svg><span>Movimientos</span></button>
    <button data-route="quotas" class="nav-item"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg><span>Cuotas</span></button>
    <button data-route="reports" class="nav-item"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/><path d="M3 20h18"/></svg><span>Informes</span></button>
    <button data-route="more" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>Más</span></button>
  </nav>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card"><div class="modal-head"><h2 id="modalTitle">Ficha</h2><button id="modalClose" class="icon-button" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div id="modalBody"></div></div>
</div>
<div id="toast" class="toast" aria-live="polite"></div>
<script src="./db.js"></script>
<script src="./pdf.js"></script>
<script src="./app.js"></script>
</body>
</html>
