<style>

y);color:#fff}.btn.danger{background:#fff0ee;color:var(--danger);border-color:#f2c6c0}.btn.small{padding:7px 9px;min-height:34px;font-size:13px}.list{display:grid;gap:8px}.row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:50%;background:#eef0f2;display:grid;place-items:center;font-weight:800;color:#5f6368;flex:none;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.rowmain{min-width:0;flex:1}.rowtitle{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;color:var(--muted);margin-top:3px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.chip{font-size:11px;border:1px solid var(--line);padding:3px 7px;border-radius:999px;background:#fafafa}.chip.orange{border-color:#f5c28f;background:#fff4e7;color:#9a4d0d}.chip.green{border-color:#b9dfca;background:#eefaf3;color:#17633e}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}.table{border-collapse:collapse;width:100%;min-width:980px;font-size:12px}.table th,.table td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;white-space:nowrap}.table th{background:#f0f2f3;position:sticky;top:0;z-index:1}.table tfoot td{font-weight:800;background:#fafafa}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700;color:#50565b}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd4d8;border-radius:11px;padding:9px 10px;background:#fff;min-height:40px;outline:none}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #f28c2822}.full{grid-column:1/-1}.checkgrid{display:flex;gap:8px;flex-wrap:wrap}.check{border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fafafa}.empty{text-align:center;color:var(--muted);padding:24px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.nav{border:0;background:transparent;color:#6a7075;border-radius:10px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px}.nav .ico{font-size:20px;line-height:1}.nav.active{color:var(--orange2);background:#fff4e7}.modal{position:fixed;inset:0;background:#0007;z-index:50;display:none;padding:14px;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;border-radius:18px 18px 10px 10px;width:min(860px,100%);max-height:92vh;overflow:auto;margin:auto;padding:16px}.sheet h3{margin:0 0 12px}.close{float:right;border:0;background:#eef0f2;border-radius:10px;padding:7px}.preview{border:1px solid var(--line);border-radius:14px;background:#fff;padding:18px;max-height:55vh;overflow:auto}.reporthead{border-bottom:3px solid var(--orange);padding-bottom:10px;margin-bottom:12px}.reporthead h1{margin:0;font-size:22px}.reportsection{margin:14px 0}.reporttable{width:100%;border-collapse:collapse;font-size:11px}.reporttable th,.reporttable td{border:1px solid #cfd4d8;padding:6px}.reporttable th{background:#eceeef}.notice{padding:10px 12px;border-radius:12px;background:#fff6e8;border:1px solid #f5cf9e;color:#7d4a12;font-size:13px}.success{background:#eef9f2;border-color:#b8dec5;color:#1e6440}.dangertext{color:var(--danger)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding-top:10px}.main{padding:10px}.hero{padding:13px}.stat{min-height:92px}.stat .value{font-size:20px}.btn{padding:8px 10px}.table{min-width:900px}}@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:20px}.stat{min-height:88px;padding:11px}.stat .value{font-size:18px}.row{padding:9px}.row .actions{display:flex;gap:4px}.btn.small{padding:6px 8px}.bottom{grid-template-columns:repeat(6,1fr)}.nav{font-size:9px}.nav .ico{font-size:18px}}
</style></head><body><div class="app"><header class="top"><div class="toprow"><div><div class="brand">Tesorería MultiOrganizacional</div><div class="orgname" id="topOrg">Sin organización seleccionada</div></div><button class="mini" id="quickImport">↥</button><button class="mini" id="quickMore">⋯</button></div></header><main class="main">
<section id="dashboard" class="view active"></section><section id="organizations" class="view"></section><section id="people" class="view"></section><section id="movements" class="view"></section><section id="quotas" class="view"></section><section id="reports" class="view"></section>
</main><nav class="bottom"><button class="nav active" data-view="dashboard"><span class="ico">⌂</span>Inicio</button><button class="nav" data-view="organizations"><span class="ico">▦</span>Organizaciones</button><button class="nav" data-view="people"><span class="ico">♙</span>Integrantes</button><button class="nav" data-view="movements"><span class="ico">↕</span>Movimientos</button><button class="nav" data-view="quotas"><span class="ico">◫</span>Cuotas</button><button class="nav" data-view="reports"><span class="ico">▤</span>Informes</button></nav></div>
<div id="modal" class="modal"><div class="sheet"><button class="close" id="modalClose">✕</button><div id="modalBody"></div></div></div>
<script>
const DB='teso_multi_v1', STORE='state'; const ORG_TYPES=['Curso','Colegio','Club deportivo','Junta de vecinos','Iglesia','Organización social','Centro de padres','Taller','Agrupación','Otro']; const ROLES=['Alumno','Socio','Jugador','Apoderado','Tutor','Representante','Dirigente','Secretaría','Tesorero/a','Presidente/a','Integrante','Voluntario/a','Otro']; const BANKS=['BancoEstado','Banco de Chile','Santander','BCI','Scotiabank','Itaú','Banco Falabella','Banco Ripley','Tenpo','Mercado Pago','MACH','Otro']; const ACCT=['Cuenta RUT','Cuenta vista','Cuenta corriente','Cuenta de ahorro','Cuenta digital','Otra']; const QUOTA_TYPES=['Mensual','Anual','Extraordinaria']; const PARTICIP=['Participa','No participa','No aplica','Eximido','Pendiente','Pagado','Parcial','Otro']; const MEDIOS=['Efectivo','Transferencia','Depósito','Tarjeta','Webpay','Otro']; const FUNDS=['Tesorería','Presidenta','Otra caja/cuenta'];
let state={organizations:[],contacts:[],memberships:[],movements:[],quotas:[],settings:{currentOrg:null,treasurer:{}}}; let currentView='dashboard';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})} async function load(){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readonly'),s=t.objectStore(STORE).get('state');s.onsuccess=()=>res(s.result||structuredClone(state));s.onerror=()=>rej(s.error)})} async function save(){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(state,'state');t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Number(n||0)); const fmtDate=x=>x?new Date(x).toLocaleDateString('es-CL'):''; const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function curOrg(){return state.organizations.find(o=>o.id===state.settings.currentOrg)||state.organizations[0]||null} function orgName(){return curOrg()?.name||'Sin organización seleccionada'} function peopleForOrg(id){return state.memberships.filter(m=>m.orgId===id).map(m=>state.contacts.find(c=>c.id===m.contactId)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name,'es'))} function membersForOrg(id){return state.memberships.filter(m=>m.orgId===id)} function balance(orgId){const ms=state.movements.filter(m=>m.orgId===orgId);let realIn=0,realOut=0;for(const m of ms){if(m.type==='Ingreso'||m.type==='Aporte')realIn+=+m.amount||0; if(m.type==='Egreso')realOut+=+m.amount||0}return {in:realIn,out:realOut,net:realIn-realOut,teso:ms.filter(m=>m.fund==='Tesorería'&&(m.type==='Ingreso'||m.type==='Aporte')).reduce((a,m)=>a+(+m.amount||0),0)-ms.filter(m=>m.fund==='Tesorería'&&m.type==='Egreso').reduce((a,m)=>a+(+m.amount||0),0)}}
function nav(v){currentView=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+v).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){const o=curOrg();$('#topOrg').textContent=o?o.name:'Sin organización seleccionada';renderDash();renderOrgs();renderPeople();renderMovements();renderQuotas();renderReports()}
function renderDash(){const el=$('#dashboard');const o=curOrg();if(!o){el.innerHTML=`<div class="hero"><h1>Bienvenido</h1><p>Comienza creando una organización o importando tu respaldo.</p><div class="toolbar"><button class="btn primary" onclick="newOrg()">＋ Nueva organización</button><button class="btn dark" onclick="importJSON()">↥ Importar JSON</button></div></div><div class="grid"><div class="card stat"><div class="label">Agenda maestra</div><div class="value">${state.contacts.length}</div><small>contactos</small></div><div class="card stat"><div class="label">Organizaciones</div><div class="value">${state.organizations.length}</div><small>activas</small></div></div>`;return}const b=balance(o.id), people=peopleForOrg(o.id), monthly=state.movements.filter(m=>m.orgId===o.id&&m.type==='Aporte'&&m.quotaType==='Mensual').reduce((a,m)=>a+(+m.amount||0),0),annual=state.movements.filter(m=>m.orgId===o.id&&m.type==='Aporte'&&m.quotaType==='Anual').reduce((a,m)=>a+(+m.amount||0),0),extra=state.movements.filter(m=>m.orgId===o.id&&m.type==='Aporte'&&m.quotaType==='Extraordinaria').reduce((a,m)=>a+(+m.amount||0),0);el.innerHTML=`<div class="hero"><h1>${esc(o.name)}</h1><p>${esc(o.type||'')} ${o.institution?'· '+esc(o.institution):''} ${o.year?'· '+esc(o.year):''}</p><div class="toolbar"><button class="btn primary" onclick="newMovement()">＋ Movimiento</button><button class="btn" onclick="newQuota()">＋ Cuota</button><button class="btn" onclick="newContact()">＋ Contacto</button><button class="btn" onclick="showOrg(${JSON.stringify(o.id)})">⚙ Organización</button></div></div><div class="grid"><div class="card stat"><div class="label">Saldo real en Tesorería</div><div class="value">${money(b.teso)}</div><small>No incluye saldos teóricos</small></div><div class="card stat"><div class="label">Saldo total registrado</div><div class="value">${money(b.net)}</div><small>Ingresos menos egresos</small></div><div class="card stat"><div class="label">Integrantes</div><div class="value">${people.length}</div><small>orden alfabético</small></div><div class="card stat"><div class="label">Movimientos</div><div class="value">${state.movements.filter(m=>m.orgId===o.id).length}</div><small>con respaldo si existe</small></div></div><div class="section"><h2>Cuotas por categoría</h2><div class="grid"><div class="card"><b>Mensuales</b><div class="value">${money(monthly)}</div></div><div class="card"><b>Anuales</b><div class="value">${money(annual)}</div></div><div class="card"><b>Extraordinarias</b><div class="value">${money(extra)}</div></div><div class="card"><b>Ingresos efectivos</b><div class="value">${money(b.in)}</div></div></div></div><div class="section"><h2>Últimos gastos</h2>${recentExpenses(o.id)}</div>`}
function recentExpenses(id){const a=state.movements.filter(m=>m.orgId===id&&m.type==='Egreso').sort((x,y)=>String(y.date).localeCompare(String(x.date))).slice(0,5);if(!a.length)return'<div class="card empty">No hay egresos registrados.</div>';return`<div class="list">${a.map(m=>`<div class="row"><div class="avatar">$</div><div class="rowmain"><div class="rowtitle">${esc(m.concept)}</div><div class="sub">${fmtDate(m.date)} · ${esc(m.fund||'')} · ${esc(m.payment||'')}</div></div><b>${money(m.amount)}</b></div>`).join('')}</div>`}
function renderOrgs(){const el=$('#organizations');el.innerHTML=`<div class="hero"><h1>Organizaciones</h1><p>Una persona puede participar en varias organizaciones.</p><div class="toolbar"><button class="btn primary" onclick="newOrg()">＋ Nueva organización</button><button class="btn" onclick="importJSON()">↥ Importar JSON</button><button class="btn" onclick="exportJSON()">↥ Exportar JSON</button><button class="btn" onclick="exportExcel()">▦ Exportar Excel</button><button class="btn danger" onclick="resetAll()">Borrar suite</button></div></div><div class="list">${state.organizations.map(o=>`<div class="row"><div class="avatar">▦</div><div class="rowmain"><div class="rowtitle">${esc(o.name)}</div><div class="sub">${esc(o.type||'')} · ${esc(o.institution||'')} · ${esc(o.year||'')}</div></div><button class="btn small" onclick="selectOrg('${o.id}')">Abrir</button><button class="btn small" onclick="showOrg('${o.id}')">Editar</button></div>`).join('')||'<div class="card empty">No hay organizaciones.</div>'}</div>`}
function renderPeople(){const o=curOrg();const el=$('#people');if(!o){el.innerHTML='<div class="hero"><h1>Integrantes</h1><p>Selecciona o crea una organización.</p></div>';return}const ps=peopleForOrg(o.id);el.innerHTML=`<div class="hero"><h1>Integrantes</h1><p>${ps.length} integrantes · orden alfabético</p><div class="toolbar"><button class="btn primary" onclick="newContact()">＋ Nuevo contacto</button><button class="btn" onclick="pickPhoneContact()">📱 Seleccionar contacto</button><input id="peopleSearch" class="btn" placeholder="Buscar por nombre, RUT o teléfono" oninput="filterPeople(this.value)"></div></div><div id="peopleList" class="list">${ps.map(personRow).join('')||'<div class="card empty">No hay integrantes.</div>'}</div>`}
function personRow(c){const o=curOrg(), rel=state.memberships.find(m=>m.orgId===o.id&&m.contactId===c.id);return`<div class="row personrow" data-search="${esc((c.name+' '+(c.rut||'')+' '+(c.phone||'')).toLowerCase())}"><div class="avatar">${c.photo?`<img src="${c.photo}">`:esc((c.name||'?').split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div class="rowmain"><div class="rowtitle">${esc(c.name)}</div><div class="sub">${esc(c.phone||'')} · ${esc(c.email||'')}</div><div class="chips">${(rel?.roles||[]).map(r=>`<span class="chip orange">${esc(r)}</span>`).join('')} ${c.tutor?`<span class="chip">Tutor: ${esc(c.tutor)}</span>`:''}</div></div><button class="btn small" onclick="showContact('${c.id}')">Ficha</button></div>`}
function filterPeople(q){q=q.toLowerCase();document.querySelectorAll('.personrow').forEach(r=>r.style.display=r.dataset.search.includes(q)?'flex':'none')}
function renderMovements(){const el=$('#movements');const o=curOrg();if(!o){el.innerHTML='<div class="hero"><h1>Movimientos</h1><p>Selecciona o crea una organización.</p></div>';return}const ms=state.movements.filter(m=>m.orgId===o.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));el.innerHTML=`<div class="hero"><h1>Movimientos</h1><p>Ingresos, egresos, aportes, fondos y respaldos.</p><div class="toolbar"><button class="btn primary" onclick="newMovement()">＋ Nuevo movimiento</button></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Tipo</th><th>Clasificación</th><th>Concepto</th><th>Persona</th><th>Fondo</th><th>Medio</th><th>Monto</th><th>Respaldo</th><th></th></tr></thead><tbody>${ms.map(m=>`<tr><td>${fmtDate(m.date)}</td><td>${esc(m.type)}</td><td>${esc(m.quotaType||'')}</td><td>${esc(m.concept)}</td><td>${esc(m.personName||'')}</td><td>${esc(m.fund||'')}</td><td>${esc(m.payment||'')}</td><td>${money(m.amount)}</td><td>${m.attachment?'✓':''}</td><td><button class="btn small" onclick="editMovement('${m.id}')">Editar</button></td></tr>`).join('')}</tbody></table></div>`}
function renderQuotas(){const el=$('#quotas');const o=curOrg();if(!o){el.innerHTML='<div class="hero"><h1>Cuotas</h1><p>Selecciona o crea una organización.</p></div>';return}const qs=state.quotas.filter(q=>q.orgId===o.id);el.innerHTML=`<div class="hero"><h1>Cuotas</h1><p>Mensuales, anuales y extraordinarias, con condición de participación independiente.</p><div class="toolbar"><button class="btn primary" onclick="newQuota()">＋ Nueva cuota</button></div></div><div class="list">${qs.map(q=>`<div class="row"><div class="avatar">◫</div><div class="rowmain"><div class="rowtitle">${esc(q.name)}</div><div class="sub">${esc(q.type)} · ${esc(q.participation)} · ${money(q.amount)}</div></div><button class="btn small" onclick="editQuota('${q.id}')">Editar</button></div>`).join('')||'<div class="card empty">No hay cuotas definidas.</div>'}</div>`}
function renderReports(){const el=$('#reports');const o=curOrg();if(!o){el.innerHTML='<div class="hero"><h1>Informes</h1><p>Selecciona o crea una organización.</p></div>';return}const ps=peopleForOrg(o.id);el.innerHTML=`<div class="hero"><h1>Informes y planillas</h1><p>Documentos con datos de organización, tesorero, cuentas y Tesorería real.</p><div class="toolbar"><button class="btn primary" onclick="reportGeneral()">Informe general PDF</button><button class="btn" onclick="reportPeople()">Informe integrantes PDF</button><button class="btn" onclick="reportGeneral(true)">Planilla GENERAL Excel</button><button class="btn" onclick="reportFinance()">Informe financiero PDF</button></div></div><div class="section"><h2>Informe individual</h2><div class="list">${ps.map(c=>`<div class="row"><div class="avatar">${esc((c.name||'?')[0])}</div><div class="rowmain"><div class="rowtitle">${esc(c.name)}</div><div class="sub">${esc(c.rut||'')} · ${esc(c.phone||'')}</div></div><button class="btn small" onclick="reportPerson('${c.id}')">Abrir informe</button><button class="btn small" onclick="showContact('${c.id}')">Ficha</button></div>`).join('')||'<div class="card empty">No hay integrantes.</div>'}</div></div><div class="notice">Los PDF se generan como archivo descargable. Si el dispositivo admite Web Share, podrás enviarlos por WhatsApp, correo u otra aplicación.</div>`}

function exportExcel(){const o=curOrg(),ms=state.movements.filter(m=>m.orgId===o.id),ps=peopleForOrg(o.id);let rows=ms.map(m=>`<tr><td>${fmtDate(m.date)}</td><td>${esc(m.type)}</td><td>${esc(m.quotaType)}</td><td>${esc(m.concept)}</td><td>${esc(m.personName)}</td><td>${esc(m.fund)}</td><td>${esc(m.payment)}</td><td>${m.amount}</td><td>${esc(m.authorizes)}</td><td>${esc(m.responsible)}</td><td>${m.attachment?'Sí':''}</td><td>${esc(m.notes)}</td></tr>`).join('');const html=`<html><head><meta charset="utf-8"><style>body{font-family:Arial}h1{color:#5f6368}th{background:#f28c28;color:#fff}td,th{border:1px solid #aaa;padding:5px}</style></head><body><h1>${esc(o.name)} — GENERAL</h1><p>Tesorero/a: ${esc(o.treasurer||'')} · Banco: ${esc(o.bank||'')} · Cuenta: ${esc(o.accountType||'')} ${esc(o.accountNumber||'')}</p><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Clasificación</th><th>Concepto</th><th>Persona</th><th>Fondo</th><th>Medio</th><th>Monto</th><th>Autoriza</th><th>Responsable gasto</th><th>Respaldo</th><th>Observaciones</th></tr></thead><tbody>${rows}</tbody></table></body></html>`;download('Planilla_GENERAL_'+safeName(o.name)+'.xls',html,'application/vnd.ms-excel')}
function safeName(s){return String(s||'Informe').replace(/[^\w\-áéíóúñÁÉÍÓÚÑ ]+/g,'').replace(/\s+/g,'_').slice(0,80)}
function reportPerson(id){const c=state.contacts.find(x=>x.id===id),o=curOrg(),ms=state.movements.filter(m=>m.orgId===o.id&&m.personId===id||m.orgId===o.id&&m.personName===c.name),html=reportHTML('Informe individual — '+c.name,o,`<div class="reportsection"><b>Integrante:</b> ${esc(c.name)} · ${esc(c.rut||'')}</div><div class="reportsection"><b>Contacto:</b> ${esc(c.phone||'')} · ${esc(c.email||'')} · ${esc(c.address||'')}</div><div class="reportsection"><b>Tutor / responsable:</b> ${esc(c.tutor||'')}</div>${reportMovementTable(ms)}`);previewOrPDF(html,'Informe_'+safeName(c.name)+'.pdf')}
function reportGeneral(asExcel=false){const o=curOrg(),ms=state.movements.filter(m=>m.orgId===o.id);if(asExcel)return exportExcel();const html=reportHTML('Informe general',o,`${reportSummary(o)}${reportMovementTable(ms)}`);previewOrPDF(html,'Informe_General_'+safeName(o.name)+'.pdf')}
function reportPeople(){const o=curOrg(),ps=peopleForOrg(o.id);const rows=ps.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.rut||'')}</td><td>${esc(c.phone||'')}</td><td>${esc(c.email||'')}</td><td>${esc(c.tutor||'')}</td><td>${esc(c.bank||'')} ${esc(c.accountNumber||'')}</td></tr>`).join('');previewOrPDF(reportHTML('Informe de integrantes',o,`<table class="reporttable"><thead><tr><th>Nombre</th><th>RUT</th><th>Teléfono</th><th>Correo</th><th>Tutor</th><th>Cuenta</th></tr></thead><tbody>${rows}</tbody></table>`),'Informe_Integrantes_'+safeName(o.name)+'.pdf')}
function reportFinance(){const o=curOrg(),ms=state.movements.filter(m=>m.orgId===o.id);previewOrPDF(reportHTML('Informe financiero',o,`${reportSummary(o)}<h2>Cuotas mensuales</h2>${reportMovementTable(ms.filter(m=>m.quotaType==='Mensual'))}<h2>Cuotas anuales</h2>${reportMovementTable(ms.filter(m=>m.quotaType==='Anual'))}<h2>Cuotas extraordinarias</h2>${reportMovementTable(ms.filter(m=>m.quotaType==='Extraordinaria'))}`),'Informe_Financiero_'+safeName(o.name)+'.pdf')}
function reportSummary(o){const b=balance(o.id);return `<div class="reportsection"><b>Organización:</b> ${esc(o.name)} · ${esc(o.type||'')} · ${esc(o.institution||'')} · ${esc(o.year||'')}</div><div class="reportsection"><b>Tesorero/a:</b> ${esc(o.treasurer||'')} · ${esc(o.treasurerRut||'')} · ${esc(o.treasurerPhone||'')} · ${esc(o.treasurerEmail||'')}</div><div class="reportsection"><b>Cuenta institución:</b> ${esc(o.bank||'')} · ${esc(o.accountType||'')} · ${esc(o.accountNumber||'')} · Titular: ${esc(o.accountHolder||'')}</div><div class="reportsection"><b>Saldo real en Tesorería:</b> ${money(b.teso)} · <b>Saldo registrado:</b> ${money(b.net)}</div>`}
function reportMovementTable(ms){if(!ms.length)return'<p>Sin registros.</p>';return`<table class="reporttable"><thead><tr><th>Fecha</th><th>Tipo</th><th>Clasificación</th><th>Concepto</th><th>Persona</th><th>Fondo</th><th>Medio</th><th>Monto</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${fmtDate(m.date)}</td><td>${esc(m.type)}</td><td>${esc(m.quotaType||'')}</td><td>${esc(m.concept)}</td><td>${esc(m.personName||'')}</td><td>${esc(m.fund||'')}</td><td>${esc(m.payment||'')}</td><td>${money(m.amount)}</td></tr>`).join('')}</tbody></table>`}
function reportHTML(title,o,body){return`<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;color:#202428;padding:24px;font-size:11px}.reporthead{border-bottom:3px solid #f28c28;padding-bottom:10px;margin-bottom:12px}.reporthead h1{margin:0;font-size:22px}.reporttable{width:100%;border-collapse:collapse;font-size:9px}.reporttable th,.reporttable td{border:1px solid #bfc4c8;padding:5px}.reporttable th{background:#e8eaec}.reportsection{margin:10px 0}h2{font-size:14px;margin:16px 0 6px}</style></head><body><div class="reporthead"><h1>${esc(title)}</h1><div>${esc(o.name)} · ${esc(o.institution||'')} · ${esc(o.year||'')}</div></div>${body}<hr><div><b>Tesorero/a:</b> ${esc(o.treasurer||'')} · ${esc(o.treasurerPhone||'')} · ${esc(o.treasurerEmail||'')}</div></body></html>`}
function previewOrPDF(html,filename){modal(`<h3>${esc(filename)}</h3><div class="preview" id="reportPreview">${html.replace(/<!doctype html>|<html>|<head>[\s\S]*?<\/head>|<\/html>|<body>|<\/body>/gi,'')}</div><div class="toolbar"><button class="btn primary" onclick="makePDF(${JSON.stringify(html)},${JSON.stringify(filename)})">Guardar PDF</button><button class="btn" onclick="sharePDF(${JSON.stringify(html)},${JSON.stringify(filename)})">Compartir</button><button class="btn" onclick="download(${JSON.stringify(filename)},${JSON.stringify(html)},'text/html')">Guardar HTML</button></div>`)}
function makePDF(html,filename){const text=html.replace(/<style>[\s\S]*?<\/style>/gi,'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();const lines=[];for(let i=0;i<text.length;i+=105)lines.push(text.slice(i,i+105));const pdf=pdfText(lines.slice(0,90));download(filename,pdf,'application/pdf')}
function pdfText(lines){const escPdf=s=>s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');let y=800,stream='BT /F1 9 Tf 36 '+y+' Td ';for(const l of lines){stream+=`(${escPdf(l)}) Tj 0 -12 Td `}stream+='ET';const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];let out='%PDF-1.4\n',offs=[0];for(let i=0;i<objs.length;i++){offs[i+1]=out.length;out+=`${i+1} 0 obj\n${objs[i]}\nendobj\n`}const xref=out.length;out+='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<offs.length;i++)out+=String(offs[i]).padStart(10,'0')+' 00000 n \n';out+=`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;return out}
async function sharePDF(html,filename){const text=html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();const pdf=pdfText(text.match(/.{1,105}(?:\s|$)/g)||[text]);const file=new File([pdf],filename,{type:'application/pdf'});if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({title:filename,text:'Informe de Tesorería',files:[file]})}else{download(filename,pdf,'application/pdf');const w=encodeURIComponent('Informe de Tesorería: '+filename);if(confirm('El PDF fue descargado. ¿Quieres abrir WhatsApp para enviarlo?'))window.open('https://wa.me/?text='+w,'_blank')}}
function resetAll(){if(confirm('Se borrará toda la suite de este dispositivo. Esta acción no se puede deshacer.')){indexedDB.deleteDatabase(DB);location.reload()}}
